<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BOM Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* brass - warm, and the one the other tools have not taken */
    --navy:#2b1f0c;--navy-2:#3a2a10;--accent:#d99b2e;--accentB:#f0bb55;--accentD:#a8721a;--accent-ink:#201604;
    --bg:#1b1408;--card:#261d0e;--card-2:#20180b;--line:#3e2f16;--line3:#584324;
    --text:#f5eddf;--muted:#b0a086;--zebra:rgba(255,255,255,.018);
    --ok:#34c98b;--warn:#f2a33a;--bad:#e2607a;--info:#4f9bf0;
    --glow:rgba(217,155,46,.5);--glowSoft:rgba(217,155,46,.28);
  }
  html[data-theme="light"]{
    --navy:#3a2a10;--navy-2:#4c3815;--accent:#8a5f10;--accentB:#a87a1c;--accentD:#6b4808;--accent-ink:#ffffff;
    --bg:#faf6ee;--card:#ffffff;--card-2:#fdfaf3;--line:#e6ddcb;--line3:#cfc2a7;
    --text:#2b1f0c;--muted:#6b6152;--zebra:rgba(0,0,0,.022);
    --ok:#1f9a68;--warn:#b8721c;--bad:#c2405c;--info:#2f6fd0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

  .hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line3);box-shadow:0 6px 26px rgba(0,0,0,.5);overflow:hidden}
  .hdr::before{content:'';position:absolute;inset:-24px 0;pointer-events:none;opacity:.45;
    background-image:linear-gradient(rgba(240,187,85,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(240,187,85,.07) 1px,transparent 1px);
    background-size:24px 24px;animation:tGrid 3.2s linear infinite}
  @keyframes tGrid{to{transform:translateY(24px)}}
  .hdr>*{position:relative;z-index:1}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45);font-size:0;transition:transform .18s ease}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px} .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px} .hdr .logo i:nth-child(4){height:13px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0}
  .hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;margin-right:auto;
    white-space:nowrap;color:#fff;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:rgba(0,0,0,.32);border:1px solid var(--line3);
    color:#f6e6c8;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accentB);animation:tLed 1.6s ease-in-out infinite;flex-shrink:0}
  @keyframes tLed{0%,100%{opacity:.35}50%{opacity:1}}
  .pill b{color:var(--accentB)}
  .theme{background:none;border:1px solid var(--line3);color:#fff;border-radius:9px;width:34px;height:34px;
    font-size:15px;cursor:pointer;flex-shrink:0;transition:border-color .2s ease,transform .2s ease}
  .theme:hover{border-color:var(--accentB);transform:scale(1.06)}
  @media (max-width:820px){.hdr .bname,.hdr .hsep{display:none}}
  @media (max-width:700px){.hdr .pill{display:none}}

  .tabs{position:sticky;top:55px;z-index:25;display:flex;gap:4px;overflow-x:auto;padding:10px 14px;
    background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;border:1px solid var(--line);background:var(--card-2);color:var(--muted);border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:transform .15s ease,border-color .15s ease,color .15s ease}
  .tab:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px var(--glowSoft)}

  main{max-width:1500px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 40px)}
  @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;animation:rise .4s ease both}
  .panel h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accentB);flex-shrink:0}
  .panel h2 .tag{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);font-weight:400}
  .note{color:var(--muted);font-size:13px;line-height:1.6}
  .note b{color:var(--text);font-weight:600}

  .btn{border:1px solid var(--line3);background:none;color:var(--text);border-radius:9px;padding:7px 13px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
    transition:border-color .18s ease,transform .18s ease,background .18s ease}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.del:hover{border-color:var(--bad);color:var(--bad)}

  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,input{background:var(--card-2);color:var(--text);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .18s ease}
  select:focus,input:focus{border-color:var(--accent)}
  select{min-width:130px} input[type=search]{min-width:180px;flex:1}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
  .kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--accent))}
  .kpi .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:'Bricolage Grotesque',sans-serif;font-size:29px;font-weight:800;line-height:1.1;margin-top:3px;color:var(--k,var(--text))}

  .gridwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:58vh;background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{position:sticky;top:0;background:var(--navy);color:var(--muted);text-align:left;padding:9px 10px;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    border-bottom:1px solid var(--line3);white-space:nowrap;z-index:1}
  td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  tbody tr.pick{cursor:pointer}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody tr.pick:hover{background:var(--card-2)}
  tbody tr.sel{background:rgba(217,155,46,.12);box-shadow:inset 3px 0 0 var(--accent)}
  td.k1{font-family:'Space Mono',monospace;color:var(--accentB)}
  td.n{font-family:'Space Mono',monospace;text-align:right}
  td.wrap{white-space:normal;min-width:190px}
  .warn{color:var(--warn)}
  .chip{display:inline-block;padding:1px 6px;border:1px solid var(--line3);border-radius:5px;
    font-family:'Space Mono',monospace;font-size:10.5px;margin:1px 3px 1px 0;color:var(--muted)}
  .chip.ok{border-color:var(--accentD);color:var(--accentB)}
  .chip.gap{border-color:var(--warn);color:var(--warn)}
  .chip.mine{border-color:var(--info);color:var(--info)}

  .cols{display:grid;grid-template-columns:280px 1fr;gap:20px}
  /* a grid child defaults to min-width:auto, which lets a wide table push the
     whole page sideways instead of scrolling inside its own frame */
  .cols>*{min-width:0}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .kv{font-size:12.5px}
  .kv div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-family:'Space Mono',monospace;text-align:right}
  h3.sec{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 6px;font-weight:400}

  /* the site's own facts, correctable */
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:10px}
  .facts label{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .facts input,.facts select{width:100%;padding:6px 8px;font-size:12.5px;font-family:'Space Mono',monospace}
  .facts .fixed input,.facts .fixed select{border-color:var(--info)}

  /* the lines */
  .lines td:first-child{color:var(--muted);font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.05em;text-transform:uppercase}
  .lines input.q{width:74px;padding:4px 7px;font-size:12.5px;font-family:'Space Mono',monospace;text-align:right}
  .lines input.q.mine{border-color:var(--info);color:var(--info)}
  .lines .why{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}

  /* the rule editor */
  .rules{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .rule{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card-2);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .rule select{min-width:0;width:auto;padding:5px 7px;font-size:11.5px}
  .rule input.f{width:120px;padding:5px 8px;font-size:12px;font-family:'Space Mono',monospace}
  .rule input.f.n{width:52px;text-align:center}
  .rule input.f.bad{border-color:var(--bad);color:var(--bad)}
  .rule .lab{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}
  .rule .grow{flex:1}
  .drawer{border-top:1px dashed var(--line3);margin-top:6px;padding-top:10px}

  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14.5px;line-height:1.6}
  .empty .big{font-size:36px;margin-bottom:10px;opacity:.6}
  .err{border:1px solid var(--bad);border-radius:12px;padding:14px 16px;background:rgba(226,96,122,.08);
    font-size:14px;line-height:1.6;margin-bottom:16px}
  .exrow{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .exrow>div:first-child{flex:1;min-width:0}
  .exname{font-weight:600;font-size:14.5px}
  .exmeta{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:3px}

  #drop{border:1px dashed var(--line3);border-radius:14px;padding:32px 20px;text-align:center;
    background:var(--card);cursor:pointer;transition:border-color .18s ease,background .18s ease}
  #drop:hover,#drop.hot{border-color:var(--accent);background:var(--card-2)}
  #drop b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:6px}
  #drop span{color:var(--muted);font-size:13px}
  #file{display:none}

  footer{max-width:1500px;margin:0 auto;padding:0 14px 30px;color:var(--muted);font-size:12.5px;line-height:1.7}
  footer a{color:var(--accent);text-decoration:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy-2);
    color:#fff;border:1px solid var(--line3);border-radius:10px;padding:11px 18px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span><span class="bname">Emortia</span></a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>BOM Builder</h1>
  <span class="pill" id="pill">nothing loaded</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<div class="tabs" id="tabs"></div>
<main><div id="view"></div></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   BOM Builder

   Takes what the Design Extractor read and turns it into
   something you can order. The counting lives in bom.js, which
   knows nothing about this page; bom.test.js holds it against
   the July Target sheet - 33 sites someone costed by hand.

   Three things are stored, and they are stored differently on
   purpose. The sites are large and replaceable - send a newer
   batch across and they are replaced - so they go to IndexedDB.
   The catalogue and the quantities you have typed are small,
   hand-corrected, and must outlive every batch, so they go to
   localStorage where they are easy to see and hard to lose.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SITES_KEY  = 'bom_sites_v1';       // IndexedDB, via db.js
const INBOX_KEY  = 'bom_inbox_v1';       // IndexedDB - what Design Extractor sent
const DESIGN_KEY = 'design_batch_v1';    // IndexedDB - Design Extractor's own batch
const CAT_KEY    = 'bom_catalogue_v1';   // localStorage
const OVR_KEY    = 'bom_overrides_v1';   // localStorage

let SITES = [], VIEW = [], PICK = null, SRC = '', SAVED = '';
let CAT = [], OVR = {}, BUILT = [], OPEN = '', ACTIVE = 'Sites';
const F = { batch:'', vendor:'', tx:'', q:'' };

/* ---------- theme, shared with the other tools ---------- */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* ---------- storage ---------- */
async function saveSites(){
  try { await window.DB.cacheSet(SITES_KEY, { src: SRC, savedAt: new Date().toISOString(), sites: SITES }); }
  catch(e){ toast('Could not keep the sites: ' + e.message, 5000); }
}
async function loadSites(){
  try {
    const b = await window.DB.cacheGet(SITES_KEY);
    if (b && b.sites && b.sites.length){ SITES = b.sites; SRC = b.src || ''; SAVED = b.savedAt || ''; return true; }
  } catch(e){}
  return false;
}
function saveCat(){ try { localStorage.setItem(CAT_KEY, JSON.stringify(CAT)); } catch(e){ toast('Could not keep the catalogue', 4000); } }
function saveOvr(){ try { localStorage.setItem(OVR_KEY, JSON.stringify(OVR)); } catch(e){} }
function loadKept(){
  try { const c = localStorage.getItem(CAT_KEY); CAT = c ? JSON.parse(c) : []; } catch(e){ CAT = []; }
  if (!Array.isArray(CAT) || !CAT.length) CAT = BomEngine.freshCatalogue();
  try { const o = localStorage.getItem(OVR_KEY); OVR = o ? JSON.parse(o) : {}; } catch(e){ OVR = {}; }
}

/* Both tools live at the same origin, so the handoff is not a file - the
   Design Extractor writes what its filters are showing and this reads it.
   Anything typed by hand here survives it: only the sites are replaced. */
async function takeFrom(which){
  let box = null;
  try { box = await window.DB.cacheGet(which === 'inbox' ? INBOX_KEY : DESIGN_KEY); } catch(e){}
  if (!box || !box.sites || !box.sites.length) return 0;
  SITES = box.sites;
  SRC = box.src || (which === 'inbox' ? 'sent from Design Extractor' : 'Design Extractor');
  SAVED = new Date().toISOString();
  PICK = null;
  const added = BomEngine.growCatalogue(CAT, SITES);
  if (added.length) saveCat();
  await saveSites();
  if (which === 'inbox'){ try { await window.DB.cacheSet(INBOX_KEY, null); } catch(e){} }
  return added.length;
}

/* ---------- reading a design workbook here, if you would rather ---------- */
function readFile(file){
  const fr = new FileReader();
  fr.onload = async e => {
    try {
      if (!window.DesignParser) throw new Error('The design reader is not loaded on this page. Use the Design Extractor and send it across.');
      const out = window.DesignParser.extract(XLSX.read(new Uint8Array(e.target.result), { type:'array' }), XLSX);
      SITES = out.sites; SRC = file.name; SAVED = new Date().toISOString(); PICK = null;
      const added = BomEngine.growCatalogue(CAT, SITES);
      if (added.length) saveCat();
      await saveSites();
      rebuild(); buildTabs(); render();
      toast(SITES.length + ' sites read' + (added.length ? ', ' + added.length + ' new material' + (added.length === 1 ? '' : 's') : ''));
    } catch(err){
      render();
      $('view').insertAdjacentHTML('afterbegin', '<div class="err"><b>Could not read that workbook.</b><br>' + esc(err.message) + '</div>');
      toast(err.message, 6000);
    }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- filters and the build ---------- */
function applyFilters(){
  const q = F.q.trim().toLowerCase();
  VIEW = SITES.filter(s => {
    const f = BomEngine.factsOf(s, (OVR[s.siteId] || {}).facts);
    return (!F.batch  || s.batchName === F.batch) &&
           (!F.vendor || f.vendor === F.vendor) &&
           (!F.tx     || f.tx === F.tx) &&
           (!q || (String(s.siteId) + ' ' + String(s.siteName || '')).toLowerCase().includes(q));
  });
  rebuild();
}
function rebuild(){
  BUILT = BomEngine.build(VIEW, CAT, OVR);
  $('pill').innerHTML = SITES.length ? '<b>' + VIEW.length + '</b> of ' + SITES.length + ' sites' : 'nothing loaded';
}
const distinct = fn => [...new Set(SITES.map(fn).filter(Boolean))].sort();

/* ---------- tabs ---------- */
function buildTabs(){
  const all = SITES.length ? ['Sites', 'Materials', 'Order', 'Export'] : ['Sites', 'Materials'];
  if (!all.includes(ACTIVE)) ACTIVE = 'Sites';
  $('tabs').innerHTML = all.map(n =>
    '<button class="tab' + (n === ACTIVE ? ' on' : '') + '" data-t="' + n + '">' + n +
    (n === 'Materials' ? ' · ' + CAT.length : '') + '</button>').join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { ACTIVE = b.dataset.t; OPEN = ''; buildTabs(); render(); });
}

/* ---------- views ---------- */

/* one site, in full */
function renderSite(site){
  const b = BomEngine.buildSite(site, CAT, OVR);
  const own = OVR[site.siteId] || {};
  const p = own.facts || {};
  const f = b.site;

  const fld = (k, label, opts) => {
    const on = p[k] != null && p[k] !== '';
    const inner = opts
      ? '<select data-fact="' + k + '"><option value="">' + esc(String(f[k] || '—')) + ' (as designed)</option>' +
        opts.map(o => '<option value="' + esc(o) + '"' + (p[k] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : '<input data-fact="' + k + '" value="' + esc(p[k] != null ? p[k] : '') + '" placeholder="' + esc(String(f[k] || '')) + '">';
    return '<div class="' + (on ? 'fixed' : '') + '"><label>' + label + '</label>' + inner + '</div>';
  };

  let h = '<div class="panel"><h2><span class="dot"></span>' + esc(f.id) + (f.name ? ' · ' + esc(f.name) : '') +
    '<span class="tag">' + b.lines.length + ' lines · ' + b.total + ' items</span></h2>';

  if (f.gaps.length)
    h += '<p class="note warn" style="margin-bottom:4px">The design does not say ' +
         f.gaps.map(g => '<b>' + esc(g) + '</b>').join(', ') +
         ' for this one, so nothing that depends on it has been costed. Fill it in below and the lines appear.</p>';

  h += '<div class="cols" style="margin-top:12px"><div>' +
    '<div class="kv">' +
      '<div><span>Sectors</span><span>' + f.sec + '</span></div>' +
      '<div><span>RRUs</span><span>' + f.rru + '</span></div>' +
      '<div><span>Antennas</span><span>' + f.ant + '</span></div>' +
      '<div><span>Batch</span><span>' + esc(site.batchName || '—') + '</span></div>' +
    '</div>' +
    '<h3 class="sec">what the site is</h3>' +
    '<div class="facts">' +
      fld('vendor', 'Vendor', ['Huawei','Ericsson']) +
      fld('tx', 'Fed by', ['MW-HYB','WiBAS','OFN']) +
      fld('band', 'MW band', ['15G','18G','23G']) +
      fld('ht', 'Height (m)') +
    '</div>' +
    (f.edited.length ? '<p class="note" style="margin-top:9px;font-size:11.5px">Corrected here: ' +
      f.edited.map(k => '<span class="chip mine">' + esc(k) + '</span>').join('') +
      ' <button class="btn sm" id="clearFacts">put them back</button></p>' : '') +
    '</div><div>';

  let last = '';
  h += '<div class="gridwrap" style="max-height:none"><table class="lines"><thead><tr>' +
       ['','Material','Unit','Qty','Where it comes from'].map(c => '<th>' + c + '</th>').join('') +
       '</tr></thead><tbody>' +
    b.lines.map(l => {
      const row = '<tr>' +
        '<td>' + (l.cat === last ? '' : esc(l.cat)) + '</td>' +
        '<td class="wrap">' + esc(l.name) + '</td>' +
        '<td>' + esc(l.unit || '') + '</td>' +
        '<td><input class="q' + (l.edited ? ' mine' : '') + '" data-qty="' + esc(BomEngine.key(l.name)) +
            '" value="' + l.qty + '" inputmode="numeric"></td>' +
        '<td class="why">' + esc(l.why) + '</td></tr>';
      last = l.cat; return row;
    }).join('') + '</tbody></table></div>' +
    '<p class="note" style="margin-top:9px;font-size:11.5px">Type over any quantity and it stays typed for this site only - ' +
    'zero takes the line off. ' +
    (own.qty && Object.keys(own.qty).length
      ? '<button class="btn sm" id="clearQty">put all ' + Object.keys(own.qty).length + ' back</button>' : '') +
    '</p></div></div></div>';
  return h;
}

/* the catalogue, and the rules behind it */

    '<span class="tag">' + CAT.length + ' materials</span></h2>' +

  list.forEach((it, i) => {

function ruleWords(r){
  const w = r.when || {};
  if (w.off) return 'off · ' + r.q;
  const bits = [];
  if (w.vendor) bits.push(w.vendor.join('/'));
  if (w.tx)     bits.push(w.tx.join('/'));
  if (w.band)   bits.push(w.band.join('/'));
  if (w.minRru != null) bits.push(w.minRru + '+ RRU');
  if (w.minSec != null) bits.push(w.minSec + '+ sectors');
  if (w.minHt  != null) bits.push(w.minHt + 'm+');
  return (bits.length ? bits.join(' ') + ' → ' : '') + r.q;
}

function ruleEditor(it, idx){
  if (it.from === 'design')
    return '<p class="note">The design decides this one. It is ' + esc(it.ref.model) +
      ', counted exactly as the design sheet writes it' +
      (it.ref.kind === 'rru' ? ' - a radio written into three technology columns is still one box on the pole.' : '.') +
      '<br><br>Model in the design: <input data-ref="' + idx + '" value="' + esc(it.ref.model) + '" style="min-width:260px">' +
      ' <span class="lab" style="font-family:\'Space Mono\',monospace;font-size:11px;color:var(--muted)">change this if the design names it differently</span></p>';

  const opt = (vals, cur, any) => '<option value="">' + any + '</option>' +
    vals.map(v => '<option value="' + esc(v) + '"' + ((cur || []).includes(v) ? ' selected' : '') + '>' + esc(v) + '</option>').join('');

  let h = '<p class="note">Tried top to bottom; the first one that fits the site wins. ' +
    'The quantity can use <b>sec</b>, <b>rru</b>, <b>ant</b> and <b>ht</b>' +
    (it.fit ? ' · against the reference sheet this agreed <b>' + esc(it.fit) + '</b>' : '') + '</p><div class="rules">';
  (it.rules || []).forEach((r, ri) => {
    const w = r.when || {};
    h += '<div class="rule">' +
      '<label class="lab"><input type="checkbox" data-off="' + idx + '.' + ri + '"' + (w.off ? '' : ' checked') +
        '> on</label>' +
      '<select data-w="' + idx + '.' + ri + '.vendor">' + opt(['Huawei','Ericsson'], w.vendor, 'any vendor') + '</select>' +
      '<select data-w="' + idx + '.' + ri + '.tx">' + opt(['MW-HYB','WiBAS','OFN'], w.tx, 'however fed') + '</select>' +
      '<select data-w="' + idx + '.' + ri + '.band">' + opt(['15G','18G','23G'], w.band, 'any band') + '</select>' +
      '<span class="lab">from</span>' +
      '<input class="f n" data-n="' + idx + '.' + ri + '.minRru" value="' + (w.minRru != null ? w.minRru : '') + '" placeholder="RRU">' +
      '<input class="f n" data-n="' + idx + '.' + ri + '.minSec" value="' + (w.minSec != null ? w.minSec : '') + '" placeholder="sec">' +
      '<input class="f n" data-n="' + idx + '.' + ri + '.minHt"  value="' + (w.minHt  != null ? w.minHt  : '') + '" placeholder="m">' +
      '<span class="lab">qty</span><input class="f" data-q="' + idx + '.' + ri + '" value="' + esc(r.q) + '">' +
      '<span class="grow"></span>' +
      '<button class="btn sm del" data-delrule="' + idx + '.' + ri + '">Remove</button></div>';
  });
  return h + '</div><div class="bar" style="margin-top:9px"><button class="btn sm" data-addrule="' + idx + '">Add a rule</button></div>';
}

/* ---------- export ---------- */
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toWorkbook(){
  const wb = XLSX.utils.book_new();
  const add = (name, aoa) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);

  add('BOM', BomEngine.toMatrix(BUILT, CAT));

  add('Order', [['Category','Material Detail','Unit','Sites','Total']].concat(
    BomEngine.rollup(BUILT)
      .sort((a, b) => a.cat === b.cat ? a.name.localeCompare(b.name) : a.cat.localeCompare(b.cat))
      .map(r => [r.cat, r.name, r.unit, r.sites, r.total])));

  add('Lines', [['Site ID','Site Name','Vendor','Height','Fed by','Band','Sectors','RRUs','Antennas',
      'Category','Material Detail','Unit','Qty','Where it comes from']].concat(
    BUILT.flatMap(b => b.lines.map(l => [b.site.id, b.site.name, b.site.vendor, b.site.ht, b.site.tx,
      b.site.band, b.site.sec, b.site.rru, b.site.ant, l.cat, l.name, l.unit, l.qty, l.why]))));

  add('Sites', [['Site ID','Site Name','Batch','Vendor','Height','Fed by','Band','Sectors','RRUs','Antennas',
      'Lines','Items','Missing','Corrected by hand']].concat(
    BUILT.map(b => [b.site.id, b.site.name, (SITES.find(s => s.siteId === b.site.id) || {}).batchName || '',
      b.site.vendor, b.site.ht, b.site.tx, b.site.band, b.site.sec, b.site.rru, b.site.ant,
      b.lines.length, b.total, b.site.gaps.join(', '), b.site.edited.join(', ')])));

  add('Rules', [['Category','Material Detail','Unit','Comes from','When','Quantity','Against the reference']].concat(
    CAT.flatMap(it => it.from === 'design'
      ? [[it.cat, it.name, it.unit, 'design', it.ref.model, 'as designed', it.fit || '']]
      : (it.rules || []).map(r => [it.cat, it.name, it.unit, 'rule', ruleWords(r).split(' → ')[0] || 'always',
                                   r.q, it.fit || '']))));
  return wb;
}

/* ---------- wiring ---------- */
function wire(){
  const drop = $('drop'), file = $('file');
  if (drop){
    drop.onclick = () => file.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } };
    file.onchange = e => e.target.files[0] && readFile(e.target.files[0]);
    ['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hot'); }));
    ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hot'); }));
    drop.addEventListener('drop', e => e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]));
  }

  const pull = async () => {
    const added = await takeFrom('design');
    if (!SITES.length){ toast('The Design Extractor has no batch yet - read a workbook there first', 5000); return; }
    applyFilters(); buildTabs(); render();
    toast(SITES.length + ' sites taken' + (added ? ', ' + added + ' new material' + (added === 1 ? '' : 's') : ''));
  };
  ['bPull','bPull2'].forEach(id => { const b = $(id); if (b) b.onclick = pull; });

  const bind = (id, key) => { const el = $(id); if (el) el.onchange = () => { F[key] = el.value; applyFilters(); render(); }; };
  bind('fBatch','batch'); bind('fVendor','vendor'); bind('fTx','tx');
  const search = (id, key) => { const el = $(id); if (!el) return; let t;
    el.addEventListener('input', e => { clearTimeout(t); const v = e.target.value;
      t = setTimeout(() => { F[key] = v; if (key === 'q') applyFilters(); render();
        const n = $(id); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 140); }); };
  search('q','q'); search('mq','mq');

  [...document.querySelectorAll('tbody tr[data-i]')].forEach(tr => tr.onclick = e => {
    if (e.target.closest('input,select,button')) return;
    const s = VIEW[+tr.dataset.i];
    PICK = (PICK === s) ? null : s;
    render();
    if (PICK){ const p = document.querySelector('.panel'); if (p) p.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
  });

  /* ---- a site's own facts ---- */
  const own = () => { const id = PICK.siteId; OVR[id] = OVR[id] || {}; return OVR[id]; };
  [...document.querySelectorAll('[data-fact]')].forEach(el => el.onchange = () => {
    const o = own(); o.facts = o.facts || {};
    const v = el.value.trim();
    if (v === '') delete o.facts[el.dataset.fact]; else o.facts[el.dataset.fact] = v;
    if (!Object.keys(o.facts).length) delete o.facts;
    if (!Object.keys(o).length) delete OVR[PICK.siteId];
    saveOvr(); applyFilters(); render();
  });
  const cf = $('clearFacts');
  if (cf) cf.onclick = () => { const o = OVR[PICK.siteId]; if (o){ delete o.facts;
    if (!Object.keys(o).length) delete OVR[PICK.siteId]; } saveOvr(); applyFilters(); render(); toast('Back to what the design says'); };

  /* ---- a quantity typed by hand ---- */
  [...document.querySelectorAll('[data-qty]')].forEach(el => el.onchange = () => {
    const o = own(); o.qty = o.qty || {};
    const raw = el.value.trim();
    const n = parseFloat(raw);
    if (raw === '' || !isFinite(n)) delete o.qty[el.dataset.qty];
    else o.qty[el.dataset.qty] = Math.max(0, Math.round(n));
    if (!Object.keys(o.qty).length) delete o.qty;
    if (!Object.keys(o).length) delete OVR[PICK.siteId];
    saveOvr(); rebuild(); render();
  });
  const cq = $('clearQty');
  if (cq) cq.onclick = () => { const o = OVR[PICK.siteId]; if (o){ delete o.qty;
    if (!Object.keys(o).length) delete OVR[PICK.siteId]; } saveOvr(); rebuild(); render(); toast('Quantities back to the rules'); };

  /* ---- the catalogue ---- */
  [...document.querySelectorAll('[data-open]')].forEach(tr => tr.onclick = e => {
    if (e.target.closest('input,select,button')) return;
    OPEN = OPEN === tr.dataset.open ? '' : tr.dataset.open;
    render();
  });
  const at = s => { const [i, r] = s.split('.'); return { it: CAT[+i], r: CAT[+i].rules[+r], i:+i, ri:+r }; };
  const keep = () => { saveCat(); rebuild(); render(); };

  [...document.querySelectorAll('[data-off]')].forEach(cb => cb.onchange = () => {
    const { r } = at(cb.dataset.off);
    r.when = r.when || {};
    if (cb.checked) delete r.when.off; else r.when.off = true;
    keep();
  });
  [...document.querySelectorAll('[data-w]')].forEach(sl => sl.onchange = () => {
    const [i, ri, field] = sl.dataset.w.split('.');
    const r = CAT[+i].rules[+ri];
    r.when = r.when || {};
    if (sl.value) r.when[field] = [sl.value]; else delete r.when[field];
    keep();
  });
  [...document.querySelectorAll('[data-n]')].forEach(el => el.onchange = () => {
    const [i, ri, field] = el.dataset.n.split('.');
    const r = CAT[+i].rules[+ri];
    r.when = r.when || {};
    const v = parseFloat(el.value);
    if (el.value.trim() === '' || !isFinite(v)) delete r.when[field]; else r.when[field] = v;
    keep();
  });
  [...document.querySelectorAll('[data-q]')].forEach(el => el.onchange = () => {
    const { r } = at(el.dataset.q);
    try { BomEngine.compile(el.value); }
    catch(err){ el.classList.add('bad'); toast(err.message, 5000); return; }
    el.classList.remove('bad');
    r.q = el.value.trim();
    keep();
  });
  [...document.querySelectorAll('[data-delrule]')].forEach(b => b.onclick = () => {
    const { it, ri } = at(b.dataset.delrule);
    it.rules.splice(ri, 1); keep();
  });
  [...document.querySelectorAll('[data-addrule]')].forEach(b => b.onclick = () => {
    const it = CAT[+b.dataset.addrule];
    it.rules = it.rules || []; it.rules.push({ q:'1' }); keep();
  });
  [...document.querySelectorAll('[data-ref]')].forEach(el => el.onchange = () => {
    const it = CAT[+el.dataset.ref];
    it.ref.model = el.value.trim(); keep();
  });
  [...document.querySelectorAll('[data-delmat]')].forEach(b => b.onclick = () => {
    const it = CAT[+b.dataset.delmat];
    if (!confirm('Take ' + it.name + ' off every BOM?\n\nThe rules behind it go with it. Back to the reference sheet brings it all back.')) return;
    CAT.splice(+b.dataset.delmat, 1); OPEN = ''; saveCat(); rebuild(); buildTabs(); render(); toast(it.name + ' removed');
  });
  const am = $('addMat');
  if (am) am.onclick = () => {
    const name = (prompt('What is it called?\n\nWrite it the way the BOM sheet writes it.') || '').trim();
    if (!name) return;
    if (CAT.some(x => BomEngine.key(x.name) === BomEngine.key(name))){ toast('Already in the catalogue'); return; }
    const cat = (prompt('Which heading does it sit under?', 'Local Purchased') || 'Local Purchased').trim();
    CAT.push({ cat: cat, name: name, unit:'nos', from:'rule', rules:[{ q:'1' }], added:true });
    OPEN = String(CAT.length - 1);
    saveCat(); rebuild(); buildTabs(); render();
    toast(name + ' added - now say how many');
  };
  const cr = $('catReset');
  if (cr) cr.onclick = () => {
    if (!confirm('Put the catalogue back to the July Target sheet?\n\nEvery rule you have changed and every material you have added goes. The quantities you typed on individual sites stay.')) return;
    CAT = BomEngine.freshCatalogue();
    const added = BomEngine.growCatalogue(CAT, SITES);
    OPEN = ''; saveCat(); rebuild(); buildTabs(); render();
    toast('Back to the reference' + (added.length ? ', plus ' + added.length + ' from the design' : ''));
  };

  /* ---- export ---- */
  const stamp = new Date().toISOString().slice(0, 10);
  const x = $('bXls');
  if (x) x.onclick = () => { XLSX.writeFile(toWorkbook(), 'bom-' + stamp + '.xlsx');
    toast(BUILT.length + ' sites exported'); };
  const o = $('bOrder');
  if (o) o.onclick = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(
      [['Category','Material Detail','Unit','Sites','Total']].concat(
        BomEngine.rollup(BUILT)
          .sort((a, b) => a.cat === b.cat ? a.name.localeCompare(b.name) : a.cat.localeCompare(b.cat))
          .map(r => [r.cat, r.name, r.unit, r.sites, r.total]))), 'Order');
    XLSX.writeFile(wb, 'bom-order-' + stamp + '.xlsx');
    toast('Order exported');
  };
  const j = $('bJson');
  if (j) j.onclick = () => { download('bom-' + stamp + '.json',
    new Blob([JSON.stringify(BomEngine.envelope(BUILT, CAT, { source: SRC }), null, 2)], { type:'application/json' }));
    toast(BUILT.length + ' sites downloaded'); };
  const c = $('bCat');
  if (c) c.onclick = () => { download('bom-catalogue.json',
    new Blob([JSON.stringify(CAT, null, 2)], { type:'application/json' })); toast('Catalogue downloaded'); };
}

/* ---------- boot ---------- */
(async function(){
  loadKept();
  buildTabs(); render();
  /* something sent across from the Design Extractor wins over what is kept */
  let added = await takeFrom('inbox');
  if (!SITES.length) await loadSites();
  if (SITES.length){
    const grew = BomEngine.growCatalogue(CAT, SITES);
    if (grew.length) saveCat();
    applyFilters(); buildTabs(); render();
    if (added) toast(SITES.length + ' sites arrived from the Design Extractor');
  }
})();
</script>
</body>
</html>
