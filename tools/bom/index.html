<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0f09">
<title>BOM Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* copper — the one warm tone the other tools had not taken */
    --navy:#2a170d;--navy-2:#3a2011;--accent:#d1622e;--accentB:#e88350;--accentD:#a44a20;--accent-ink:#1a0b04;
    --bg:#1a0f09;--card:#26170f;--card-2:#20130c;--line:#3d2618;--line3:#563723;
    --text:#f6ece5;--muted:#b3937d;--zebra:rgba(255,255,255,.018);
    --ok:#34c98b;--warn:#f2764a;--info:#4f9bf0;--idle:#8d7a6c;
    --glow:rgba(209,98,46,.5);--glowSoft:rgba(209,98,46,.28);
  }
  html[data-theme="light"]{
    --navy:#3a2011;--navy-2:#4a2b16;--accent:#b04d1f;--accentB:#d1622e;--accentD:#8a3a14;--accent-ink:#ffffff;
    --bg:#faf5f1;--card:#ffffff;--card-2:#fdf8f4;--line:#e8dbd0;--line3:#d4c0b0;
    --text:#2a170d;--muted:#7a6355;--zebra:rgba(0,0,0,.022);
    --ok:#1f9a68;--warn:#c2542c;--info:#2f6fd0;--idle:#7a6355;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

  .hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line3);box-shadow:0 6px 26px rgba(0,0,0,.5);overflow:hidden}
  .hdr::before{content:'';position:absolute;inset:-24px 0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(232,131,80,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(232,131,80,.07) 1px,transparent 1px);
    background-size:24px 24px;animation:tGrid 2.8s linear infinite}
  @keyframes tGrid{to{transform:translateY(24px)}}
  .hdr>*{position:relative;z-index:1}
  .hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;margin-right:auto;
    white-space:nowrap;color:#fff;overflow:hidden;text-overflow:ellipsis}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:rgba(0,0,0,.32);border:1px solid var(--line3);
    color:#f0dccd;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accentB);animation:tLed 1.6s ease-in-out infinite}
  @keyframes tLed{0%,100%{opacity:.35}50%{opacity:1}}
  .pill b{color:var(--accentB)}
  .theme{background:none;border:1px solid var(--line3);color:#fff;border-radius:9px;width:34px;height:34px;
    font-size:15px;cursor:pointer;flex-shrink:0;transition:border-color .2s ease,transform .2s ease}
  .theme:hover{border-color:var(--accentB);transform:scale(1.06)}

  .tabs{position:sticky;top:55px;z-index:25;display:flex;gap:4px;overflow-x:auto;padding:10px 14px;
    background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;border:1px solid var(--line);background:var(--card-2);color:var(--muted);border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:transform .15s ease,border-color .15s ease,color .15s ease}
  .tab:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px var(--glowSoft)}

  main{max-width:1100px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 40px)}
  @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;
    animation:rise .4s ease both}
  .panel h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accentB);flex-shrink:0}
  .panel h2 .tag{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);font-weight:400}
  .note{color:var(--muted);font-size:13px;line-height:1.6}

  .btn{border:1px solid var(--line3);background:none;color:var(--text);border-radius:9px;padding:7px 13px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
    transition:border-color .18s ease,transform .18s ease,background .18s ease}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.del:hover{border-color:var(--warn);color:var(--warn)}

  .field{margin-bottom:12px}
  .field label{display:block;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--card-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:14.5px;font-family:inherit;outline:none;transition:border-color .18s ease}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* the BOM itself */
  .lines{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:11px;overflow:hidden}
  .lgrp{background:var(--navy-2);padding:7px 13px;font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--accentB)}
  .line{display:flex;align-items:center;gap:11px;background:var(--card);padding:9px 13px}
  .line:hover{background:var(--card-2)}
  .line .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .line .un{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);width:34px;flex-shrink:0}
  .line input.q{width:74px;flex-shrink:0;text-align:right;padding:5px 8px;font-family:'Space Mono',monospace;font-size:13px}
  .line .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
    padding:2px 5px;border-radius:6px;flex-shrink:0}
  .line .x:hover{color:var(--warn);background:rgba(242,118,74,.1)}

  /* suggestions */
  .sug{border:1px dashed var(--accent);border-radius:12px;background:rgba(209,98,46,.06);padding:14px;margin-bottom:16px}
  .sug h3{font-size:14px;font-family:'Bricolage Grotesque',sans-serif;margin-bottom:4px}
  .sugrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .sugrow:first-of-type{border-top:none}
  .sugrow .nm{flex:1;min-width:140px;font-size:13.5px}
  .sugrow .why{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}
  .sugrow .qt{font-family:'Space Mono',monospace;font-size:12px;color:var(--accentB);width:52px;text-align:right}

  .catlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:11px;overflow:hidden;max-height:60vh;overflow-y:auto}
  .crow{display:flex;align-items:center;gap:11px;background:var(--card);padding:8px 13px;cursor:pointer}
  .crow:hover{background:rgba(209,98,46,.1)}
  .crow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
  .crow .ct{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .crow.in{opacity:.45}

  .bomcard{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .bomcard .id{font-family:'Space Mono',monospace;font-size:13px;color:var(--accentB);font-weight:700}
  .bomcard .meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}

  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14.5px;line-height:1.6}
  .empty .big{font-size:36px;margin-bottom:10px;opacity:.6}
  .err{border:1px solid var(--warn);border-radius:12px;padding:13px 15px;color:var(--text);
    background:rgba(242,118,74,.08);font-size:13.5px;line-height:1.6;margin-bottom:14px}

  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.7}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy-2);
    color:#fff;border:1px solid var(--line3);border-radius:10px;padding:11px 18px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}

  /* the site's mark, and the way back to it */
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;text-decoration:none;font-size:0;
    padding:0;border:none;cursor:pointer;transition:transform .18s ease}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-0.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  .hdr h1{flex:0 1 auto;min-width:7ch}
  .hdr .pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }
</style>

<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>BOM Builder</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<div class="tabs" id="tabs"></div>
<main><div id="view"></div><footer></footer></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   BOM Builder — a bill of materials for a lamp pole site.

   The catalogue and the typical quantities come from BOM.xlsx. The jumper
   suggestion is the part worth explaining: a jumper is named for the two
   ports it joins, so once you say what is on the antenna end and what is on
   the RRU end there is only one jumper it can be. The sheet bears that out —
   the same antennas and RRUs appear with two different jumper sets, and what
   separates them is not the equipment but which port convention the site was
   built to, which is a thing you know and the spreadsheet cannot.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT = window.BOM_CATALOGUE || [];
const COMPANIONS = window.BOM_COMPANIONS || [];

let ACTIVE = 'Build', BOMS = [], PORTS = {}, LOAD_ERR = null, QUERY = '';
let SITES = null;   // the Site Access list, once it has loaded
let BOM = null;                       // the one being edited

/* ---------- theme ---------- */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* ---------- a working copy, kept locally so nothing is lost on a refresh ---------- */
const DRAFT_KEY = 'bom_draft_v1';
function blankBom(){ return { id:null, site_id:'', site_name:'', tx_plan:'MW-HYB', sectors:3, rrus:5, note:'', lines:[], ports:{} }; }
function loadDraft(){
  try { const raw = localStorage.getItem(DRAFT_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return blankBom();
}
function saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(BOM)); } catch(e){} }

/* ---------- the site list ----------
   Every Dialog site is already in Site Access, so a site ID is enough — the
   name comes from there rather than being typed twice and spelt two ways.
   The tool's own upload wins if there is one, else the published snapshot. */
function idb(name, store){ return new Promise((res, rej) => { const r = indexedDB.open(name, 1);
  r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(store)) r.result.createObjectStore(store); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(name, store, k){ try { const db = await idb(name, store);
  return await new Promise(res => { const t = db.transaction(store).objectStore(store).get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch(e){ return null; } }

async function loadSites(){
  let ds = await idbGet('site_access_db', 'ds', 'dataset');
  if (!ds || !ds.cols){ try { ds = await (await fetch('../site-access/data.json')).json(); } catch(e){ ds = null; } }
  if (!ds || !ds.cols) return;
  const iId = ds.cols.indexOf('Site_ID'), iNm = ds.cols.indexOf('Site_Name');
  if (iId < 0) return;
  SITES = {};
  ds.rows.forEach(r => { const k = String(r[iId] || '').trim().toUpperCase();
    if (k && !SITES[k]) SITES[k] = iNm >= 0 ? String(r[iNm] || '').trim() : ''; });
}
function siteName(id){ return SITES ? (SITES[String(id || '').trim().toUpperCase()] || null) : null; }

/* ---------- the catalogue ---------- */
const byName = {}; CAT.forEach(m => byName[m.n] = m);
const CATS = [...new Set(CAT.map(m => m.c))];
const onBom = n => BOM.lines.find(l => l.name === n);

function addLine(name, qty, quiet){
  const m = byName[name];
  if (!m) return;
  const have = onBom(name);
  if (have){ if (qty != null) have.qty = qty; }
  else BOM.lines.push({ name, cat: m.c, unit: m.u || '', qty: qty != null ? qty : (m.t != null ? m.t : 1) });
  saveDraft();
  if (!quiet) render();
}
function removeLine(name){ BOM.lines = BOM.lines.filter(l => l.name !== name); saveDraft(); render(); }

/* ---------- ports and jumpers ----------
   Every jumper in the catalogue is named "<end>-<end> (<length>)", so the
   catalogue itself tells us which port types exist and which jumper joins
   which pair. Nothing is hard-coded: add a jumper named 43-22 to the
   catalogue and 43 becomes a port type you can pick. */
function jumperParts(){
  return CAT.filter(m => m.c === 'Jumpers').map(m => {
    const mm = m.n.match(/^(\w+)-(\w+)\s*\(([^)]+)\)/);
    return mm ? { name:m.n, a:mm[1], b:mm[2], len:mm[3], t:m.t } : null;
  }).filter(Boolean);
}
function portTypes(){
  const s = new Set();
  jumperParts().forEach(j => { s.add(j.a); s.add(j.b); });
  Object.values(PORTS).forEach(p => p.port && s.add(p.port));
  return [...s].sort();
}
/* A jumper joins the two ends whatever order they are written in. */
function jumpersFor(antPort, rruPort){
  if (!antPort || !rruPort) return [];
  return jumperParts().filter(j =>
    (j.a === antPort && j.b === rruPort) || (j.a === rruPort && j.b === antPort));
}

const ANT_CATS = ['GSM Antenna'];
const RRU_CATS = ['RRU with Brackets & Power Connectors'];
function gearOn(cats){ return BOM.lines.filter(l => cats.includes(l.cat)); }
/* The port for one piece of gear: what this BOM says, else what the Ports tab
   says, else nothing — and it is asked for per model, because a site can carry
   two RRU types and they need not share a connector. */
function portOf(name){
  return (BOM.ports && BOM.ports[name]) || (PORTS[name] || {}).port || '';
}
function setPort(name, port){
  BOM.ports = BOM.ports || {};
  if (port) BOM.ports[name] = port; else delete BOM.ports[name];
  saveDraft();
}

/* The sheet's own arithmetic: two 3m jumpers and four 5m jumpers per sector.
   Shown as the working, not hidden, because a BOM is checked by hand. */
function jumperQty(len, sectors){
  const s = Math.max(1, +sectors || 1);
  return /^3/.test(len) ? 2 * s : 4 * s;
}

/* ---------- what else the BOM probably needs ---------- */
function suggestions(){
  const out = [];
  const sec = Math.max(1, +BOM.sectors || 1);
  for (const rule of COMPANIONS){
    const trigger = BOM.lines.find(l =>
      rule.when.test(l.name) && (!rule.cat || l.cat === rule.cat));
    if (!trigger) continue;
    for (const s of rule.suggest){
      if (onBom(s.n)) continue;
      if (!byName[s.n]) continue;
      const qty = s.same ? trigger.qty : s.per ? s.per * sec : s.flat;
      out.push({ name:s.n, qty, why:s.why, from:rule.label });
    }
  }
  return out;
}

/* ---------- tabs ---------- */
function buildTabs(){
  const all = ['Build', 'Catalogue', 'Ports', 'Saved'];
  $('tabs').innerHTML = all.map(n =>
    '<button class="tab' + (n === ACTIVE ? ' on' : '') + '" data-t="' + n + '">' + n + '</button>').join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { ACTIVE = b.dataset.t; QUERY = ''; buildTabs(); render(); });
}
function refreshPill(){
  const n = BOM ? BOM.lines.length : 0;
  $('pill').innerHTML = '<b>' + n + '</b> line' + (n === 1 ? '' : 's') + (BOM && BOM.site_id ? ' · ' + esc(BOM.site_id) : '');
}

/* ---------- views ---------- */
function renderBuild(){
  let h = '';
  if (LOAD_ERR) h += '<div class="err"><b>Not syncing.</b><br>' + esc(LOAD_ERR) + '<br>' +
    'The BOM you are building is kept in this browser meanwhile.</div>';

  h += '<div class="panel"><h2><span class="dot"></span>The site' +
    '<span class="tag">' + (BOM.id ? 'saved' : 'not saved yet') + '</span></h2>' +
    '<div class="row">' +
      '<div class="field"><label for="fid">Site ID</label><input id="fid" value="' + esc(BOM.site_id) + '" placeholder="MU5051"></div>' +
      '<div class="field"><label for="fname">Site name' + (siteName(BOM.site_id) ? ' · from Site Access' : '') + '</label><input id="fname" value="' + esc(BOM.site_name) + '" placeholder="Iyankankulam_Lamp"></div>' +
      '<div class="field"><label for="ftx">Tx plan</label><select id="ftx">' +
        ['MW-HYB','WiBAS','OFN'].map(t => '<option' + (BOM.tx_plan === t ? ' selected' : '') + '>' + t + '</option>').join('') +
      '</select></div>' +
      '<div class="field"><label for="fsec">Sectors</label><input id="fsec" type="number" min="1" max="8" value="' + esc(BOM.sectors) + '"></div>' +
      '<div class="field"><label for="frru">RRUs</label><input id="frru" type="number" min="1" max="12" value="' + esc(BOM.rrus) + '"></div>' +
    '</div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px">' +
      '<button class="btn on" id="saveBtn">Save this BOM</button>' +
      '<button class="btn" id="newBtn">Start a new one</button>' +
      '<button class="btn del" id="clearBtn"' + (BOM.lines.length ? '' : ' disabled') +
        '>Clear all' + (BOM.lines.length ? ' (' + BOM.lines.length + ')' : '') + '</button>' +
      '<button class="btn" id="xlsBtn">⬇ Excel</button>' +
    '</div></div>';

  /* The jumper question, asked per piece of gear rather than once. A site can
     carry two RRU models and they need not share a connector, so each is asked
     separately and each answer produces its own jumper. */
  const ports = portTypes();
  const ants = gearOn(ANT_CATS), rrus = gearOn(RRU_CATS);
  const sel = (name, label) => '<div class="field"><label>' + esc(label) + '</label>' +
    '<select data-gear="' + esc(name) + '"><option value="">—</option>' +
    ports.map(x => '<option' + (portOf(name) === x ? ' selected' : '') + '>' + x + '</option>').join('') +
    '</select></div>';

  h += '<div class="panel"><h2><span class="dot"></span>Jumpers</h2>' +
    '<p class="note" style="margin-bottom:12px">Say what is on each end and the jumper follows – it is named for the two ports it joins.</p>';

  if (!ants.length && !rrus.length){
    h += '<div class="row">' +
      '<div class="field"><label for="pant">Antenna port</label><select id="pant"><option value="">—</option>' +
        ports.map(x => '<option' + (BOM.antPort === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="prru">RRU port</label><select id="prru"><option value="">—</option>' +
        ports.map(x => '<option' + (BOM.rruPort === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
      '</div><p class="note">Put an antenna and an RRU on the BOM and each one gets asked for its own port.</p>';
  } else {
    h += '<div class="row">';
    ants.forEach(a => h += sel(a.name, 'Antenna · ' + a.name));
    rrus.forEach(r => h += sel(r.name, 'RRU · ' + r.name + ' (×' + r.qty + ')'));
    h += '</div>';
  }

  /* One suggestion per pair of ends that are both known. Where two RRU models
     answer differently the per-sector total is split between them by how many
     of each there are, because the run count follows the radios. */
  const pairs = [];
  const antList = ants.length ? ants : (BOM.antPort ? [{ name:'(antenna)', qty:1, _p:BOM.antPort }] : []);
  const rruList = rrus.length ? rrus : (BOM.rruPort ? [{ name:'(RRU)', qty:1, _p:BOM.rruPort }] : []);
  /* Group the radios by the port they carry before splitting anything. Two
     RRU models on the same connector want one jumper between them, not two
     halves rounded up separately — which is how 12 became 13. */
  const groups = {};
  rruList.forEach(r => { const port = r._p || portOf(r.name); if (!port) return;
    (groups[port] = groups[port] || { port, qty:0, names:[] });
    groups[port].qty += (+r.qty || 1); groups[port].names.push(r.name); });
  const gs = Object.values(groups);
  const totalRru = gs.reduce((n, g) => n + g.qty, 0) || 1;
  antList.forEach(a => gs.forEach(g => {
    const ap = a._p || portOf(a.name);
    if (!ap) return;
    jumpersFor(ap, g.port).forEach(j => {
      const whole = jumperQty(j.len, BOM.sectors);
      const share = gs.length > 1 ? Math.round(whole * g.qty / totalRru) : whole;
      pairs.push({ j, ap, rp: g.port, qty: share, split: gs.length > 1,
                   rru: g.names.join(" + "), per: /^3/.test(j.len) ? 2 : 4 });
    });
  }));

  if (!pairs.length){
    const anyPort = antList.some(a => a._p || portOf(a.name)) && rruList.some(r => r._p || portOf(r.name));
    h += '<p class="note">' + (anyPort
      ? 'No jumper in the catalogue joins those two ports. Either a converter is needed, or that is a jumper to add to the catalogue.'
      : 'Set a port on each end.') + '</p>';
  } else {
    // the same jumper asked for twice is one line, added up
    const rolled = {};
    pairs.forEach(x => {
      const k = x.j.name;
      if (!rolled[k]) rolled[k] = { name:k, qty:0, why:[], per:x.per, ap:x.ap, rp:x.rp };
      rolled[k].qty += x.qty;
      rolled[k].why.push(x.split ? x.rru + ' ' + x.qty : x.per + ' per sector × ' + BOM.sectors);
    });
    h += '<div class="sug"><h3>What joins those ends</h3>';
    Object.values(rolled).forEach(r => {
      h += '<div class="sugrow"><span class="nm">' + esc(r.name) + '</span>' +
           '<span class="why">' + esc(r.ap) + ' → ' + esc(r.rp) + ' · ' + esc(r.why.join(', ')) + '</span>' +
           '<span class="qt">' + r.qty + '</span>' +
           '<button class="btn sm" data-add="' + esc(r.name) + '" data-qty="' + r.qty + '">' +
             (onBom(r.name) ? 'on the BOM' : 'Add') + '</button></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // everything else that usually travels with what is already here
  const sug = suggestions();
  if (sug.length){
    h += '<div class="sug"><h3>Because you added ' +
      esc([...new Set(sug.map(s => s.from))].join(', ')) + '</h3>';
    sug.forEach(s => {
      h += '<div class="sugrow"><span class="nm">' + esc(s.name) + '</span>' +
           '<span class="why">' + esc(s.why) + '</span><span class="qt">' + s.qty + '</span>' +
           '<button class="btn sm" data-add="' + esc(s.name) + '" data-qty="' + s.qty + '">Add</button></div>';
    });
    h += '<div style="margin-top:10px"><button class="btn sm" id="addAll">Add all ' + sug.length + '</button></div></div>';
  }

  // the BOM itself
  h += '<div class="panel"><h2><span class="dot"></span>The bill' +
       '<span class="tag">' + BOM.lines.length + ' lines</span></h2>';
  if (!BOM.lines.length)
    h += '<div class="empty"><div class="big">📋</div>Nothing on it yet.<br>Add materials from the <b>Catalogue</b> tab.</div>';
  else {
    h += '<div class="lines">';
    CATS.forEach(c => {
      const ls = BOM.lines.filter(l => l.cat === c);
      if (!ls.length) return;
      h += '<div class="lgrp">' + esc(c) + '</div>';
      ls.forEach(l => {
        h += '<div class="line"><span class="nm">' + esc(l.name) + '</span>' +
             '<input class="q" type="number" min="0" value="' + esc(l.qty) + '" data-q="' + esc(l.name) + '">' +
             '<span class="un">' + esc(l.unit) + '</span>' +
             '<button class="x" data-rm="' + esc(l.name) + '" title="Remove">×</button></div>';
      });
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderCatalogue(){
  const q = QUERY.trim().toLowerCase();
  const hits = CAT.filter(m => !q || (m.n + ' ' + m.c).toLowerCase().includes(q));
  let h = '<div class="panel"><h2><span class="dot"></span>Catalogue' +
    '<span class="tag">' + hits.length + ' of ' + CAT.length + '</span></h2>' +
    '<div class="field"><input id="q" type="search" placeholder="Search a material…" value="' + esc(QUERY) + '" autocomplete="off"></div>' +
    '<p class="note" style="margin-bottom:12px">Tap to put it on the BOM at its usual quantity – change it there.</p>';
  if (!hits.length) h += '<div class="empty">Nothing matches “' + esc(QUERY) + '”.</div>';
  else {
    h += '<div class="catlist">';
    let last = '';
    hits.forEach(m => {
      if (m.c !== last){ h += '<div class="lgrp">' + esc(m.c) + '</div>'; last = m.c; }
      const has = !!onBom(m.n);
      h += '<div class="crow' + (has ? ' in' : '') + '" data-pick="' + esc(m.n) + '">' +
           '<span class="nm">' + esc(m.n) + '</span>' +
           '<span class="ct">' + (has ? 'on the BOM' : (m.t != null ? m.t + ' ' + esc(m.u || '') : esc(m.u || ''))) + '</span></div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

function renderPorts(){
  const kinds = [
    { k:'antenna', label:'Antennas', cats:['GSM Antenna','MW Antenna'] },
    { k:'rru', label:'RRUs', cats:['RRU with Brackets & Power Connectors'] }
  ];
  const ports = portTypes();
  let h = '<div class="panel"><h2><span class="dot"></span>Port types</h2>' +
    '<p class="note" style="margin-bottom:14px">What connector each one carries. The Build tab uses these to work out the jumper – ' +
    'and to pre-fill the two ends when you put one on the BOM.</p>';
  kinds.forEach(kd => {
    h += '<div class="lgrp" style="border-radius:8px;margin:14px 0 8px">' + kd.label + '</div>';
    CAT.filter(m => kd.cats.includes(m.c)).forEach(m => {
      const cur = (PORTS[m.n] || {}).port || '';
      h += '<div class="line" style="border-radius:9px;margin-bottom:4px;border:1px solid var(--line)">' +
           '<span class="nm">' + esc(m.n) + '</span>' +
           '<select style="width:110px" data-port="' + esc(m.n) + '" data-kind="' + kd.k + '">' +
             '<option value="">—</option>' +
             ports.map(p => '<option' + (cur === p ? ' selected' : '') + '>' + p + '</option>').join('') +
           '</select></div>';
    });
  });
  return h + '</div>';
}

function renderSaved(){
  let h = '';
  if (LOAD_ERR) h += '<div class="err"><b>Not syncing.</b><br>' + esc(LOAD_ERR) + '</div>';
  h += '<div class="panel"><h2><span class="dot"></span>Saved BOMs' +
       '<span class="tag">' + BOMS.length + '</span></h2>';
  if (!BOMS.length) h += '<div class="empty"><div class="big">🗂</div>None saved yet.<br>Build one and press <b>Save this BOM</b>.</div>';
  else BOMS.forEach(b => {
    const n = (b.lines || []).length;
    h += '<div class="bomcard"><div style="flex:1;min-width:0">' +
         '<div class="id">' + esc(b.site_id || '—') + ' <span style="color:var(--text);font-family:inherit;font-weight:600">' + esc(b.site_name || '') + '</span></div>' +
         '<div class="meta">' + n + ' lines · ' + esc(b.tx_plan || '—') + ' · ' + esc(b.sectors || '?') + ' sectors, ' + esc(b.rrus || '?') + ' RRUs</div></div>' +
         '<button class="btn sm" data-open="' + esc(b.id) + '">Open</button>' +
         '<button class="btn sm del" data-drop="' + esc(b.id) + '">Delete</button></div>';
  });
  return h + '</div>';
}

function render(){
  $('view').innerHTML = ACTIVE === 'Build' ? renderBuild()
                      : ACTIVE === 'Catalogue' ? renderCatalogue()
                      : ACTIVE === 'Ports' ? renderPorts()
                      : renderSaved();
  refreshPill();

  // the site fields
  const bind = (id, key, num) => { const el = $(id); if (!el) return;
    el.onchange = () => { BOM[key] = num ? (+el.value || 0) : el.value; saveDraft(); render(); }; };
    const fid = $('fid');
  if (fid) fid.onchange = () => {
    BOM.site_id = fid.value.trim();
    // the name is already written down in Site Access; don't type it twice
    const known = siteName(BOM.site_id);
    // A name looked up for one site must not linger on the next. Only a name
    // that was typed by hand survives an ID that is not on the list.
    if (known){ BOM.site_name = known; BOM.nameFromList = true; }
    else if (BOM.nameFromList){ BOM.site_name = ""; BOM.nameFromList = false; }
    saveDraft(); render();
    if (known) toast(BOM.site_id + ' – ' + known);
    else if (SITES && BOM.site_id) toast('Not in the Site Access list', 3000);
  };
  const fn = $('fname');
  if (fn) fn.onchange = () => { BOM.site_name = fn.value; BOM.nameFromList = false; saveDraft(); render(); };
  bind('ftx','tx_plan');
  bind('fsec','sectors',true); bind('frru','rrus',true);
  const pa = $('pant'); if (pa) pa.onchange = () => { BOM.antPort = pa.value; saveDraft(); render(); };
  const pr = $('prru'); if (pr) pr.onchange = () => { BOM.rruPort = pr.value; saveDraft(); render(); };
  [...document.querySelectorAll('[data-gear]')].forEach(el => el.onchange = () => {
    setPort(el.dataset.gear, el.value); render(); });

  [...document.querySelectorAll('[data-add]')].forEach(b => b.onclick = () => {
    addLine(b.dataset.add, +b.dataset.qty); toast('Added ' + b.dataset.add); });
  const all = $('addAll'); if (all) all.onclick = () => {
    const s = suggestions(); s.forEach(x => addLine(x.name, x.qty, true)); render(); toast('Added ' + s.length); };
  [...document.querySelectorAll('[data-rm]')].forEach(b => b.onclick = () => removeLine(b.dataset.rm));
  [...document.querySelectorAll('[data-q]')].forEach(el => el.onchange = () => {
    const l = onBom(el.dataset.q); if (l){ l.qty = +el.value || 0; saveDraft(); refreshPill(); } });
  [...document.querySelectorAll('[data-pick]')].forEach(el => el.onclick = () => {
    const n = el.dataset.pick;
    if (onBom(n)){ removeLine(n); toast('Taken off'); }
    else { addLine(n); toast('Added ' + n); }
  });
  [...document.querySelectorAll('[data-port]')].forEach(el => el.onchange = async () => {
    const name = el.dataset.port, kind = el.dataset.kind, port = el.value;
    PORTS[name] = { name, kind, port };
    try { localStorage.setItem('bom_ports_v1', JSON.stringify(PORTS)); } catch(e){}
    try { await window.AuthGate.require(); await window.DB.savePortType({ name, kind, port }); }
    catch(err){ toast('Kept here only – ' + err.message, 4000); }
  });

  const q = $('q');
  if (q){ let t; q.addEventListener('input', e => { clearTimeout(t); const v = e.target.value;
    t = setTimeout(() => { QUERY = v; render(); const n = $('q');
      if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 140); }); }

  const sb = $('saveBtn'); if (sb) sb.onclick = saveBom;
  /* Emptying the list is not the same as starting a new BOM: the site and the
     ports it carries stay, so a BOM can be stripped back and rebuilt without
     typing the site in again. */
  const cb = $('clearBtn');
  if (cb) cb.onclick = () => {
    const n = BOM.lines.length;
    if (!n) return;
    if (!confirm('Take all ' + n + (n === 1 ? ' line' : ' lines') + ' off this BOM?\n\nThe site and its ports stay, so you can build it up again.')) return;
    BOM.lines = [];
    saveDraft(); render();
    toast(n + (n === 1 ? ' line' : ' lines') + ' cleared');
  };
  const nb = $('newBtn'); if (nb) nb.onclick = () => {
    if (BOM.lines.length && !confirm('Start a new BOM? The one on screen is kept only if you have saved it.')) return;
    BOM = blankBom(); saveDraft(); render(); toast('Fresh BOM'); };
  const xb = $('xlsBtn'); if (xb) xb.onclick = exportXlsx;

  [...document.querySelectorAll('[data-open]')].forEach(b => b.onclick = () => {
    const b2 = BOMS.find(x => String(x.id) === b.dataset.open); if (!b2) return;
    BOM = { id:b2.id, site_id:b2.site_id || '', site_name:b2.site_name || '', tx_plan:b2.tx_plan || 'MW-HYB',
            sectors:b2.sectors || 3, rrus:b2.rrus || 5, note:b2.note || '', lines:(b2.lines || []).slice() };
    saveDraft(); ACTIVE = 'Build'; buildTabs(); render(); toast('Opened ' + (b2.site_id || 'BOM'));
  });
  [...document.querySelectorAll('[data-drop]')].forEach(b => b.onclick = async () => {
    if (!confirm('Delete this BOM for good?')) return;
    try { await window.AuthGate.require(); await window.DB.deleteBom(b.dataset.drop);
      await refresh(); toast('Deleted'); }
    catch(err){ toast(err.message, 6000); }
  });
  renderFooter();
}

/* ---------- saving and leaving ---------- */
async function saveBom(){
  if (!BOM.site_id.trim()){ toast('Give it a site ID first'); return; }
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await window.AuthGate.require();
    const saved = await window.DB.saveBom(BOM);
    BOM.id = saved.id; saveDraft();
    await refresh();
    toast('Saved ' + BOM.site_id);
  } catch (err){ toast(err.message, 6000); }
  finally { const b = $('saveBtn'); if (b){ b.disabled = false; b.textContent = 'Save this BOM'; } }
}

function exportXlsx(){
  if (!BOM.lines.length){ toast('Nothing to export yet'); return; }
  const aoa = [['Category','Material Detail','Unit','Qty']];
  CATS.forEach(c => BOM.lines.filter(l => l.cat === c)
    .forEach(l => aoa.push([l.cat, l.name, l.unit, l.qty])));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'BOM');
  const stem = 'BOM - ' + (BOM.site_id || 'site') + (BOM.site_name ? ' ' + BOM.site_name : '');
  XLSX.writeFile(wb, stem.replace(/[\\\/:*?"<>|]/g, '-') + '.xlsx');
  toast('Downloaded ' + BOM.lines.length + ' lines');
}

/* ---------- data ---------- */
async function refresh(){
  const r = await window.DB.listBoms();
  BOMS = r.items || []; LOAD_ERR = r.error;
  const p = await window.DB.listPortTypes();
  (p.items || []).forEach(x => PORTS[x.name] = x);
  render();
}

function renderFooter(){
  const lead = window.DB.configured() ? 'Saved BOMs are shared across every device' : 'Not syncing – anon key missing';
  document.querySelector('footer').innerHTML = lead +
    ' · the one you are building is kept in this browser until you save it' +
    '<br><a href="#" id="acct">…</a>';
  const ac = $('acct');
  const paint = s => { ac.textContent = s ? ('signed in as ' + s.user.email + ' · sign out') : 'sign in to save'; };
  window.DB.session().then(paint);
  ac.onclick = async e => {
    e.preventDefault();
    const s = await window.DB.session();
    if (s){ await window.DB.signOut(); toast('Signed out'); paint(null); }
    else { const ns = await window.AuthGate.signIn(); if (ns){ toast('Signed in'); paint(ns); } }
  };
}

/* ---------- boot ---------- */
(async function(){
  BOM = loadDraft();
  try { PORTS = JSON.parse(localStorage.getItem('bom_ports_v1') || '{}'); } catch(e){ PORTS = {}; }
  buildTabs();
  render();
  await loadSites();
  render();
  await refresh();
  window.DB.onAuth(() => renderFooter());
  window.DB.subscribeBoms(refresh);
})();
</script>
</body>
</html>
