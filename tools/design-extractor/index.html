<style>
  :root{
    /* moss - the one cool green the other tools had not taken */
    --navy:#1c2a13;--navy-2:#26391a;--accent:#8fae3e;--accentB:#a9c957;--accentD:#6b8a24;--accent-ink:#0f1607;
    --bg:#111a0d;--card:#1a2614;--card-2:#152010;--line:#2b3d1f;--line3:#3f5730;
    --text:#eef4e6;--muted:#9aab88;--zebra:rgba(255,255,255,.018);
    --ok:#34c98b;--warn:#f2a33a;--bad:#e2607a;--info:#4f9bf0;
    --glow:rgba(143,174,62,.5);--glowSoft:rgba(143,174,62,.28);
  }
  html[data-theme="light"]{
    --navy:#26391a;--navy-2:#334c22;--accent:#5d7a20;--accentB:#7a9c31;--accentD:#445c14;--accent-ink:#ffffff;
    --bg:#f6f8f1;--card:#ffffff;--card-2:#fafcf6;--line:#dde5d2;--line3:#c3d0b4;
    --text:#1c2a13;--muted:#5f6d51;--zebra:rgba(0,0,0,.022);
    --ok:#1f9a68;--warn:#b8721c;--bad:#c2405c;--info:#2f6fd0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

  .hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line3);box-shadow:0 6px 26px rgba(0,0,0,.5);overflow:hidden}
  .hdr::before{content:'';position:absolute;inset:-24px 0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(169,201,87,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(169,201,87,.07) 1px,transparent 1px);
    background-size:24px 24px;animation:tGrid 2.8s linear infinite}
  @keyframes tGrid{to{transform:translateY(24px)}}
  .hdr>*{position:relative;z-index:1}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c);display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45);font-size:0;transition:transform .18s ease}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px} .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px} .hdr .logo i:nth-child(4){height:13px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0}
  .hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;margin-right:auto;
    white-space:nowrap;color:#fff;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:rgba(0,0,0,.32);border:1px solid var(--line3);
    color:#e2eed0;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accentB);animation:tLed 1.6s ease-in-out infinite;flex-shrink:0}

  select:focus,input:focus{border-color:var(--accent)}
  select{min-width:130px} input[type=search]{min-width:180px;flex:1}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
  .kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--accent))}
  .kpi .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:'Bricolage Grotesque',sans-serif;font-size:29px;font-weight:800;line-height:1.1;margin-top:3px;color:var(--k,var(--text))}

  td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}

  td.k1{font-family:'Space Mono',monospace;color:var(--accentB)}
  td.wrap{white-space:normal;min-width:190px}
  .warn{color:var(--warn)}
  .chip{display:inline-block;padding:1px 6px;border:1px solid var(--line3);border-radius:5px;

  .cols{display:grid;grid-template-columns:250px 1fr;gap:20px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .kv{font-size:12.5px}

  .kv span:last-child{font-family:'Space Mono',monospace;text-align:right}
  .read{font-family:'Space Mono',monospace;font-size:13px;line-height:1.75;white-space:pre-wrap;

  h3.sec{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 6px;font-weight:400}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .seccard{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card-2)}
  .seccard h4{margin-bottom:7px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
  .seccard h4 em{font-style:normal;color:var(--accentB);font-family:'Space Mono',monospace}
  .seccard p{font-size:11.5px;font-family:'Space Mono',monospace;color:var(--muted);word-break:break-word;margin-bottom:3px}
  .seccard p b{color:var(--text);font-weight:400}

  .compass{width:100%;aspect-ratio:1;max-width:220px;margin:0 auto;display:block}
  .compass .ring{fill:none;stroke:var(--line3);stroke-width:1}
  .compass .tick{stroke:var(--line);stroke-width:1}
  .compass .lab{fill:var(--muted);font:9px 'Space Mono',monospace}
  .compass .beam{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:1}
  .compass .num{fill:var(--text);font:700 10px 'Space Mono',monospace}

  .flags{margin-top:12px;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--warn);line-height:1.7}
  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14.5px;line-height:1.6}
  .empty .big{font-size:36px;margin-bottom:10px;opacity:.6}
  .err{border:1px solid var(--bad);border-radius:12px;padding:14px 16px;background:rgba(226,96,122,.08);

  .exrow{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);

  .exrow>div:first-child{flex:1;min-width:0}
  .exname{font-weight:600;font-size:14.5px}
  .exmeta{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:3px}

  /* the register */
  .reg td input{width:100%;padding:5px 8px;font-size:12.5px;font-family:'Space Mono',monospace}
  .reg .serves{min-width:230px}
  .techbox{display:flex;flex-wrap:wrap;gap:4px}
  .techbox label{display:inline-flex;align-items:center;gap:4px;font-family:'Space Mono',monospace;font-size:10.5px;

  .techbox label.on{border-color:var(--accent);color:var(--accentB);background:rgba(143,174,62,.10)}
  .techbox input{width:auto;margin:0}

  footer{max-width:1500px;margin:0 auto;padding:0 14px 30px;color:var(--muted);font-size:12.5px;line-height:1.7}
  footer a{color:var(--accent);text-decoration:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy-2);

    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span><span class="bname">Emortia</span></a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Design Extractor</h1>
  <span class="pill" id="pill">no batch</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<div class="tabs" id="tabs"></div>
<main><div id="view"></div></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Design Extractor

   Reads the Dialog MBB design sheet and keeps what a BOM needs.
   The reading itself lives in parser.js, which knows nothing about
   this page; parser.test.js holds it to two sites whose answers
   are known from the hand-built BOM.

   Two things are stored, and they are stored differently on
   purpose. The batch is large and disposable - drop a newer
   workbook and it is replaced - so it goes to IndexedDB. The
   radio register is small, hand-corrected, and must outlive every
   batch, so it goes to localStorage where it is easy to see and
   hard to lose.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BATCH_KEY = 'design_batch_v1';        // IndexedDB, via db.js
const REG_KEY   = 'design_register_v1';     // localStorage

let SITES = [], VIEW = [], PICK = null, CTX = null, SRC = '', SAVED = '';
let REG = {}, ACTIVE = 'Sites';
const F = { batch:'', vendor:'', type:'', region:'', q:'' };

/* ---------- theme, shared with the other tools ---------- */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* ---------- storage ---------- */
async function saveBatch(){
  try { await window.DB.cacheSet(BATCH_KEY, { src: SRC, savedAt: new Date().toISOString(), ctx: CTX, sites: SITES }); }
  catch(e){ toast('Could not keep the batch: ' + e.message, 5000); }
}
async function loadBatch(){
  try {
    const b = await window.DB.cacheGet(BATCH_KEY);
    if (b && b.sites && b.sites.length){ SITES = b.sites; CTX = b.ctx; SRC = b.src || ''; SAVED = b.savedAt || ''; return true; }
  } catch(e){}
  return false;
}
function saveReg(){ try { localStorage.setItem(REG_KEY, JSON.stringify(REG)); } catch(e){} }
function loadReg(){ try { const r = localStorage.getItem(REG_KEY); if (r) REG = JSON.parse(r) || {}; } catch(e){ REG = {}; } }

/* A model the batch knows but the register does not is added, keeping whatever
   has been corrected by hand. Nothing already in the register is overwritten —
   that is the whole point of it being yours. */
function mergeRegister(fromSheet){
  let added = 0;
  Object.values(fromSheet).forEach(r => {
    if (REG[r.model]){
      REG[r.model].seen = r.seen;
      REG[r.model].vendors = r.vendors;
    } else { REG[r.model] = r; added++; }
  });
  if (added) saveReg();
  return added;
}
const servesOf = model => (REG[model] && REG[model].serves) ? REG[model].serves.join(' + ') : '';

/* ---------- reading a workbook ---------- */
function readFile(file){
  const fr = new FileReader();
  fr.onload = async e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const out = DesignParser.extract(wb, XLSX);
      CTX = out.ctx; SITES = out.sites; SRC = file.name; SAVED = new Date().toISOString();
      PICK = null;
      const added = mergeRegister(DesignParser.buildRegister(SITES));
      await saveBatch();
      applyFilters(); buildTabs();
      toast(SITES.length + ' sites read' + (added ? ', ' + added + ' new radio' + (added === 1 ? '' : 's') + ' in the register' : ''));
    } catch(err){
      render();
      $('view').insertAdjacentHTML('afterbegin',
        '<div class="err"><b>Could not read that workbook.</b><br>' + esc(err.message) + '</div>');
      toast(err.message, 6000);
    }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- filters ---------- */
function applyFilters(){
  const q = F.q.trim().toLowerCase();
  VIEW = SITES.filter(s =>
    (!F.batch  || s.batchName === F.batch) &&
    (!F.vendor || s.ftkVendor === F.vendor) &&
    (!F.type   || s.siteType === F.type) &&
    (!F.region || s.operationRegion === F.region) &&
    (!q || (String(s.siteId) + ' ' + String(s.siteName || '')).toLowerCase().includes(q)));
  $('pill').innerHTML = SITES.length ? '<b>' + VIEW.length + '</b> of ' + SITES.length + ' sites' : 'no batch';
  render();
}
const distinct = k => [...new Set(SITES.map(s => s[k]).filter(Boolean))].sort();

/* ---------- tabs ---------- */
function buildTabs(){
  const all = SITES.length ? ['Sites', 'Radios', 'Export'] : ['Sites', 'Radios'];
  if (!all.includes(ACTIVE)) ACTIVE = 'Sites';
  $('tabs').innerHTML = all.map(n =>
    '<button class="tab' + (n === ACTIVE ? ' on' : '') + '" data-t="' + n + '">' + n +
    (n === 'Radios' && Object.keys(REG).length ? ' · ' + Object.keys(REG).length : '') + '</button>').join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { ACTIVE = b.dataset.t; buildTabs(); render(); });
}

/* ---------- the reading, as it gets said ---------- */
function reading(s){
  const v = DesignParser.summarise(s);
  const L = [];
  L.push(v.siteId + (v.siteName ? ' · ' + v.siteName : ''));
  L.push([v.vendor, v.heightM != null ? v.heightM + 'm' : null, v.txMode, v.mwBand].filter(Boolean).join('   '));
  L.push('');
  L.push('Sector ' + v.sectors + ',  RRU ' + v.rrus + ',  Antenna ' + v.antennas);
  L.push('');
  v.radios.forEach(r => {
    const serves = servesOf(r.model) || r.serves;
    L.push('  ' + String(r.count) + ' × ' + r.model + (serves ? '   (' + serves + ')' : '') +
           '   sector ' + r.sectors.join(', '));
  });
  if (v.shared.length){
    L.push('');
    v.shared.forEach(x => L.push('  sector ' + x.sector + ' ' + (x.techs||[]).join('+') +
      ' runs back to sector ' + (x.from == null ? '?' : x.from)));
  }
  if (v.antennaList.length){
    L.push('');
    v.antennaList.forEach(a => L.push('  ' + a.count + ' × ' + a.model + '   sector ' + a.sectors.join(', ')));
  }
  if (v.bbu.length || v.control.length || v.baseband.length){
    L.push('');
    if (v.bbu.length)      L.push('  BBU        ' + v.bbu.join(', '));
    if (v.control.length)  L.push('  Control    ' + v.control.join(', '));
    if (v.baseband.length) L.push('  Baseband   ' + v.baseband.join(', '));
  }
  return L.join('\n');
}

function compass(sectors){
  const R = 96, C = 110;
  const beams = sectors.filter(s => s.active && s.azimuth != null).map(s => {
    const w = 32, a0 = (s.azimuth - w) * Math.PI / 180, a1 = (s.azimuth + w) * Math.PI / 180;
    const p = (a, r) => [C + r * Math.sin(a), C - r * Math.cos(a)];
    const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [lx, ly] = p(s.azimuth * Math.PI / 180, R * 0.62);
    return '<path class="beam" d="M' + C + ' ' + C + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
           ' A' + R + ' ' + R + ' 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z"/>' +
           '<text class="num" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">S' + s.sector + '</text>';
  }).join('');
  const ticks = [0,45,90,135,180,225,270,315].map(d => {
    const a = d * Math.PI / 180;
    return '<line class="tick" x1="' + (C + 88 * Math.sin(a)).toFixed(1) + '" y1="' + (C - 88 * Math.cos(a)).toFixed(1) +
           '" x2="' + (C + 96 * Math.sin(a)).toFixed(1) + '" y2="' + (C - 96 * Math.cos(a)).toFixed(1) + '"/>';
  }).join('');
  return '<svg class="compass" viewBox="0 0 220 220" aria-label="Sector azimuths">' +
    '<circle class="ring" cx="' + C + '" cy="' + C + '" r="' + R + '"/>' +
    '<circle class="ring" cx="' + C + '" cy="' + C + '" r="' + (R * 0.5) + '"/>' + ticks + beams +
    '<text class="lab" x="' + C + '" y="12" text-anchor="middle">N</text>' +
    '<text class="lab" x="216" y="' + (C + 3) + '" text-anchor="end">E</text>' +
    '<text class="lab" x="' + C + '" y="218" text-anchor="middle">S</text>' +
    '<text class="lab" x="4" y="' + (C + 3) + '">W</text></svg>';
}

/* ---------- views ---------- */
function renderDrop(){
  return '<div id="drop" tabindex="0" role="button" aria-label="Choose a design workbook">' +
    '<b>' + (SRC ? esc(SRC) + ' · ' + SITES.length + ' sites' : 'Drop the design workbook here') + '</b>' +
    '<span>' + (SRC ? 'kept in this browser' + (SAVED ? ' since ' + SAVED.slice(0, 16).replace('T', ' ') : '') + ' · drop another to replace it'
                    : 'or click to choose one · .xlsx / .xlsm · read here, nothing is uploaded') + '</span>' +
    '<input id="file" type="file" accept=".xlsx,.xlsm,.xls"></div>';
}

function renderSites(){
  let h = renderDrop();
  if (!SITES.length) return h;

  const sel = (id, label, key, vals) => '<select id="' + id + '"><option value="">' + label + '</option>' +
    vals.map(v => '<option' + (F[key] === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>';
  h += '<div class="bar" style="margin-top:16px">' +
    sel('fBatch','All batches','batch',distinct('batchName')) +
    sel('fVendor','Both vendors','vendor',distinct('ftkVendor')) +
    sel('fType','All site types','type',distinct('siteType')) +
    sel('fRegion','All regions','region',distinct('operationRegion')) +
    '<input id="q" type="search" placeholder="Site ID or name" value="' + esc(F.q) + '"></div>';

  const sum = k => VIEW.reduce((a, s) => a + (s[k] || 0), 0);
  h += '<div class="kpis">' + [
    ['Sites', VIEW.length, 'var(--accent)'],
    ['Sectors', sum('sectorCount'), 'var(--info)'],
    ['RRUs', sum('rruCount'), 'var(--accentB)'],
    ['Antennas', sum('antennaCount'), 'var(--ok)'],
    ['Shared runs', VIEW.reduce((a, s) => a + s.sharedRuns.length, 0), 'var(--muted)'],
    ['Need a look', VIEW.filter(s => s.flags.length).length, 'var(--warn)']
  ].map(([k, v, c]) => '<div class="kpi" style="--k:' + c + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('') + '</div>';

  if (!VIEW.length) return h + '<div class="empty"><div class="big">🔍</div>Nothing matches those filters.</div>';

  h += '<div class="gridwrap"><table><thead><tr>' +
    ['Site ID','Site name','Vendor','Ht','Type','TX','Sec','RRU','Ant','Radios','Antennas','BBU','Cards']
      .map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
    VIEW.map((s, i) => '<tr data-i="' + i + '"' + (PICK === s ? ' class="sel"' : '') + '>' +
      '<td class="k1">' + esc(s.siteId) + '</td>' +
      '<td>' + esc(s.siteName || '') + '</td>' +
      '<td>' + esc(s.ftkVendor || '') + '</td>' +
      '<td>' + (s.siteHeight ?? '') + '</td>' +
      '<td>' + esc(s.siteType || '') + '</td>' +
      '<td>' + esc(s.txMode || '') + (s.mwBand ? ' <span class="chip">' + s.mwBand + '</span>' : '') + '</td>' +
      '<td>' + s.sectorCount + '</td>' +
      '<td class="' + (s.flags.some(f => f.startsWith('RRU')) ? 'warn' : '') + '">' + s.rruCount + '</td>' +
      '<td>' + s.antennaCount + '</td>' +
      '<td class="wrap">' + Object.entries(s.radios).map(([m, v]) =>
        '<span class="chip ok">' + esc(m) + ' ×' + v.count + '</span>').join('') + '</td>' +
      '<td class="wrap">' + Object.entries(s.antennas).map(([m, v]) =>
        '<span class="chip">' + esc(m) + ' ×' + v.count + '</span>').join('') + '</td>' +
      '<td>' + esc(s.bbuAddition.join(', ')) + '</td>' +
      '<td class="wrap">' + esc(s.controlCards.concat(s.basebandCards).join(', ')) + '</td>' +
      '</tr>').join('') + '</tbody></table></div>';

  if (PICK) h += renderDetail(PICK);
  return h;
}

function renderDetail(s){
  const kv = rows => '<div class="kv">' + rows.filter(r => r[1] != null && r[1] !== '')
    .map(([k, v]) => '<div><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>').join('') + '</div>';
  const act = s.sectors.filter(x => x.active);
  return '<div class="panel" style="margin-top:16px"><h2><span class="dot"></span>' +
      esc(s.siteId) + ' · ' + esc(s.siteName || '') +
      '<span class="tag">' + s.sectorCount + ' sectors · ' + s.rruCount + ' RRUs · ' + s.antennaCount + ' antennas</span></h2>' +
    '<div class="cols" style="margin-top:12px"><div>' + compass(s.sectors) +
      kv([['Batch', String(s.batchName || '').replace(/^2026_MBB_/, '')], ['Region', s.operationRegion],
          ['District', s.district], ['Vendor', s.ftkVendor], ['Supply', s.ftkOrInhouse],
          ['Site type', s.siteType], ['Height', s.siteHeight ? s.siteHeight + ' m' : null],
          ['TX', s.txMode], ['MW band', s.mwBand], ['Owner', s.siteOwner],
          ['Technologies', s.technologies.join(' ')]]) +
    '</div><div>' +
      '<h3 class="sec">What the site takes</h3><div class="read">' + esc(reading(s)) + '</div>' +
      '<h3 class="sec">Sector by sector</h3><div class="secgrid">' +
        act.map(x => '<div class="seccard"><h4>Sector ' + x.sector + '<em>' + (x.azimuth ?? '—') + '°</em></h4>' +
          '<p><b>Antenna</b> ' + esc(x.antennaType || '—') + ' ×' + (x.antennaCount ?? '—') + '</p>' +
          '<p><b>Height</b> ' + (x.height ?? '—') + 'm   <b>E</b> ' + (x.eTilt ?? '—') + '°   <b>M</b> ' + (x.mTilt ?? '—') + '°</p>' +
          x.radios.map(r => '<p><b>' + esc(r.model) + '</b> ' + esc(r.techs.join(', ')) + '</p>').join('') +
          (x.combinerType ? '<p><b>Combiner</b> ' + esc(x.combinerType) + ' ×' + (x.combinerCount || 1) + '</p>' : '') +
          '</div>').join('') + '</div>' +
      (s.flags.length ? '<div class="flags">! ' + s.flags.map(esc).join('<br>! ') + '</div>' : '') +
    '</div></div></div>';
}

function renderRadios(){
  const models = Object.values(REG).sort((a, b) => (b.seen || 0) - (a.seen || 0));
  let h = '<div class="panel"><h2><span class="dot"></span>The radio register' +
      '<span class="tag">' + models.length + ' models</span></h2>' +
    '<p class="note" style="margin-bottom:14px">What each radio carries. This is what turns three cells into one box: ' +
      'an RRU5909 written under G900, L900 and L2100 is one unit on the pole, not three. ' +
      'Read from the batch to begin with, then it is yours - tick what a model really serves and it stays that way ' +
      'through every workbook after.</p>';

  if (!models.length) return h + '<div class="empty"><div class="big">📻</div>Nothing yet.<br>Read a workbook and every radio in it lands here.</div></div>';

  h += '<div class="gridwrap" style="max-height:none"><table class="reg"><thead><tr>' +
    '<th>Radio</th><th>Carries</th><th>Vendor</th><th>Cells</th><th></th></tr></thead><tbody>' +
    models.map(r => '<tr>' +
      '<td class="k1">' + esc(r.model) + '</td>' +
      '<td class="serves"><div class="techbox">' + DesignParser.TECHS.map(t =>
        '<label class="' + ((r.serves || []).includes(t) ? 'on' : '') + '">' +
        '<input type="checkbox" data-m="' + esc(r.model) + '" data-t="' + esc(t) + '"' +
        ((r.serves || []).includes(t) ? ' checked' : '') + '>' + t + '</label>').join('') + '</div></td>' +
      '<td>' + esc((r.vendors || []).join(', ')) + '</td>' +
      '<td>' + (r.seen || 0) + '</td>' +
      '<td><button class="btn sm del" data-del="' + esc(r.model) + '">Remove</button></td>' +
      '</tr>').join('') + '</tbody></table></div>';

  h += '<div class="bar" style="margin-top:14px">' +
    '<input id="newModel" placeholder="a radio the sheet has not shown yet" style="min-width:250px">' +
    '<button class="btn" id="addModel">Add it</button>' +
    '<div style="flex:1"></div>' +
    '<button class="btn" id="regReset">Read them from the batch again</button></div>';
  return h + '</div>';
}

function renderExport(){
  const flagged = VIEW.filter(s => s.flags.length).length;
  return '<div class="panel"><h2><span class="dot"></span>Take it out' +
      '<span class="tag">' + VIEW.length + ' of ' + SITES.length + ' sites</span></h2>' +
    '<p class="note" style="margin-bottom:14px">What the filters are showing is what leaves.' +
      (flagged ? ' <b>' + flagged + '</b> of them disagree with the sheet’s own totals; they still go, carrying their flags.' : '') +
    '</p>' +
    '<div class="exrow"><div><div class="exname">Excel</div>' +
      '<div class="exmeta">five sheets - sites, sectors, radios, antennas, BBU - one row per thing</div></div>' +
      '<button class="btn on" id="bXls">⬇ Excel</button></div>' +
    '<div class="exrow"><div><div class="exname">JSON</div>' +
      '<div class="exmeta">emortia.design-extract/2, register included</div></div>' +
      '<button class="btn" id="bJson">⬇ JSON</button></div>' +
    '<div class="exrow"><div><div class="exname">The register on its own</div>' +
      '<div class="exmeta">' + Object.keys(REG).length + ' radios and what they carry</div></div>' +
      '<button class="btn" id="bReg">⬇ JSON</button></div>' +
    '<div class="exrow"><div><div class="exname">Send it to the BOM Builder</div>' +
      '<div class="exmeta">the radios, antennas and cards go across as they are - no file in between</div></div>' +
      '<button class="btn" id="bBom">→ BOM Builder</button></div>' +
    '</div>';
}

function render(){
  $('view').innerHTML = ACTIVE === 'Radios' ? renderRadios()
                      : ACTIVE === 'Export' ? renderExport() : renderSites();
  wire();
  $('foot').innerHTML = SITES.length
    ? 'Read from <b>' + esc(CTX.sheetName) + '</b>, header row ' + CTX.headerRow +
      ' · counted from the sector blocks, not the sheet’s own totals · kept in this browser'
    : 'Reads the Dialog MBB design sheet · nothing leaves this browser';
}

/* ---------- export ---------- */
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function xlName(n, used){
  let s = String(n).replace(/[:\\\/\?\*\[\]]/g, '-').slice(0, 31) || 'Sheet';
  let i = 2, base = s; while (used.has(s.toLowerCase())){ s = base.slice(0, 28) + ' (' + i++ + ')'; }
  used.add(s.toLowerCase()); return s;
}
function toWorkbook(){
  const wb = XLSX.utils.book_new(), used = new Set();
  const add = (name, aoa) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), xlName(name, used));

  add('Sites', [['Site ID','Site Name','Batch','Vendor','Site Height','Site Type','Region','District',
      'TX Mode','MW Band','Technologies','Sectors','RRUs','Antennas',
      'Radios','Antenna types','BBU','Control cards','Baseband cards','Flags']]
    .concat(VIEW.map(s => [s.siteId, s.siteName, s.batchName, s.ftkVendor, s.siteHeight, s.siteType,
      s.operationRegion, s.district, s.txMode, s.mwBand, s.technologies.join(' '),
      s.sectorCount, s.rruCount, s.antennaCount,
      Object.entries(s.radios).map(([m, v]) => m + ' x' + v.count).join(' | '),
      Object.entries(s.antennas).map(([m, v]) => m + ' x' + v.count).join(' | '),
      s.bbuAddition.join(', '), s.controlCards.join(', '), s.basebandCards.join(', '),
      s.flags.join('; ')])));

  add('Sectors', [['Site ID','Site Name','Sector','Azimuth','Install Height','E-Tilt','M-Tilt',
      'Antenna type','Antenna count','Radios','Combiner']]
    .concat(VIEW.flatMap(s => s.sectors.filter(x => x.active).map(x => [
      s.siteId, s.siteName, x.sector, x.azimuth, x.height, x.eTilt, x.mTilt,
      x.antennaType, x.antennaCount,
      x.radios.map(r => r.model + ' (' + r.techs.join('+') + ')').join(' | '),
      x.combinerType ? x.combinerType + ' x' + (x.combinerCount || 1) : '']))));

  add('Radios', [['Site ID','Site Name','Radio','Count','Carries','Sectors']]
    .concat(VIEW.flatMap(s => Object.entries(s.radios).map(([m, v]) =>
      [s.siteId, s.siteName, m, v.count, servesOf(m) || v.techs.join(' + '), v.sectors.join(', ')]))));

  add('Antennas', [['Site ID','Site Name','Antenna','Count','Sectors']]
    .concat(VIEW.flatMap(s => Object.entries(s.antennas).map(([m, v]) =>
      [s.siteId, s.siteName, m, v.count, v.sectors.join(', ')]))));

  add('BBU', [['Site ID','Site Name','Vendor','BBU addition','Control card','Baseband cards','Baseband slots']]
    .concat(VIEW.map(s => [s.siteId, s.siteName, s.ftkVendor, s.bbuAddition.join(', '),
      s.controlCards.join(', '), s.basebandCards.join(', '),
      [...s.lteMbb.baseband, ...s.lteHbb.baseband].map(c => 'slot ' + c.slot + ': ' + c.card).join(' | ')])));

  add('Radio register', [['Radio','Carries','Vendor','Cells seen']]
    .concat(Object.values(REG).sort((a, b) => (b.seen || 0) - (a.seen || 0))
      .map(r => [r.model, (r.serves || []).join(' + '), (r.vendors || []).join(', '), r.seen || 0])));
  return wb;
}

/* ---------- wiring ---------- */
function wire(){
  const drop = $('drop'), file = $('file');
  if (drop){
    drop.onclick = () => file.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } };
    file.onchange = e => e.target.files[0] && readFile(e.target.files[0]);
    ['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hot'); }));
    ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hot'); }));
    drop.addEventListener('drop', e => e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]));
  }
  const bind = (id, key) => { const el = $(id); if (el) el.onchange = () => { F[key] = el.value; applyFilters(); }; };
  bind('fBatch','batch'); bind('fVendor','vendor'); bind('fType','type'); bind('fRegion','region');
  const q = $('q');
  if (q){ let t; q.addEventListener('input', e => { clearTimeout(t); const v = e.target.value;
    t = setTimeout(() => { F.q = v; applyFilters(); const n = $('q');
      if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 140); }); }

  [...document.querySelectorAll('tbody tr[data-i]')].forEach(tr => tr.onclick = () => {
    const s = VIEW[+tr.dataset.i];
    PICK = (PICK === s) ? null : s;
    render();
    if (PICK){ const p = document.querySelector('.panel'); if (p) p.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
  });

  /* the register is edited in place */
  [...document.querySelectorAll('[data-m]')].forEach(cb => cb.onchange = () => {
    const r = REG[cb.dataset.m]; if (!r) return;
    r.serves = r.serves || [];
    if (cb.checked){ if (!r.serves.includes(cb.dataset.t)) r.serves.push(cb.dataset.t); }
    else r.serves = r.serves.filter(t => t !== cb.dataset.t);
    r.serves.sort((a, b) => DesignParser.TECHS.indexOf(a) - DesignParser.TECHS.indexOf(b));
    r.source = 'yours';
    saveReg();
    cb.closest('label').classList.toggle('on', cb.checked);
  });
  const del = m => { if (!confirm('Take ' + m + ' out of the register?')) return;
    delete REG[m]; saveReg(); buildTabs(); render(); toast(m + ' removed'); };
  [...document.querySelectorAll('[data-del]')].forEach(b => b.onclick = () => del(b.dataset.del));
  const am = $('addModel');
  if (am) am.onclick = () => {
    const el = $('newModel'), name = el.value.trim();
    if (!name) return;
    if (REG[name]){ toast('Already in the register'); return; }
    REG[name] = { model: name, serves: [], seen: 0, vendors: [], source: 'yours' };
    saveReg(); buildTabs(); render(); toast(name + ' added - now tick what it carries');
  };
  const rr = $('regReset');
  if (rr) rr.onclick = () => {
    if (!SITES.length){ toast('Read a workbook first'); return; }
    if (!confirm('Read every radio from the batch again?\n\nAnything you have ticked by hand is replaced by what the sheet says.')) return;
    REG = DesignParser.buildRegister(SITES); saveReg(); buildTabs(); render(); toast('Register read from the batch');
  };

  const x = $('bXls');
  if (x) x.onclick = () => { XLSX.writeFile(toWorkbook(), 'design-extract-' + new Date().toISOString().slice(0, 10) + '.xlsx');
    toast(VIEW.length + ' sites exported'); };
  const j = $('bJson');
  if (j) j.onclick = () => { download('design-extract.json',
    new Blob([JSON.stringify(DesignParser.envelope(VIEW, CTX, REG), null, 2)], { type:'application/json' }));
    toast(VIEW.length + ' sites downloaded'); };
  const g = $('bReg');
  if (g) g.onclick = () => { download('radio-register.json',
    new Blob([JSON.stringify(REG, null, 2)], { type:'application/json' })); toast('Register downloaded'); };

  /* Both tools sit at the same origin, so the handoff is a shelf, not a file:
     what the filters are showing is put down here and the BOM Builder picks
     it up on the way in. */
  const bom = $('bBom');
  if (bom) bom.onclick = async () => {
    if (!VIEW.length){ toast('Nothing is showing to send'); return; }
    try {
      await window.DB.cacheSet('bom_inbox_v1', {
        sentAt: new Date().toISOString(), src: SRC, sites: VIEW });
      toast(VIEW.length + ' sites sent');
      setTimeout(() => { location.href = '../bom/'; }, 350);
    } catch(e){ toast('Could not send them: ' + e.message, 5000); }
  };
}

/* ---------- boot ---------- */
(async function(){
  loadReg();
  buildTabs(); render();
  if (await loadBatch()){ applyFilters(); buildTabs(); }
})();
</script>
