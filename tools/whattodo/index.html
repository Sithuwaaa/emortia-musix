<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>What To Do</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* rose — the one accent the other tools had not taken, and it ties back to
       the site's own burgundy */
    --navy:#2a121b;--navy-2:#3a1826;--accent:#d4547a;--accentB:#e87b9c;--accentD:#a63558;--accent-ink:#1d0610;
    --bg:#190c11;--card:#25131b;--card-2:#1f0f16;--line:#3a1e29;--line3:#502c3a;
    --text:#f6eaef;--muted:#ad8b98;--zebra:rgba(255,255,255,.018);
    --ok:#34c98b;--warn:#f2764a;--info:#4f9bf0;--idle:#8d7480;
    --glow:rgba(212,84,122,.5);--glowSoft:rgba(212,84,122,.28);
  }
  html[data-theme="light"]{
    --navy:#3a1826;--navy-2:#4a2030;--accent:#b03a5e;--accentB:#d4547a;--accentD:#8a2745;--accent-ink:#ffffff;
    --bg:#faf3f5;--card:#ffffff;--card-2:#fdf7f9;--line:#e8d6dd;--line3:#d4b8c3;
    --text:#2a121b;--muted:#7a5e69;--zebra:rgba(0,0,0,.022);
    --ok:#1f9a68;--warn:#c2542c;--info:#2f6fd0;--idle:#7a5e69;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

  /* header — same shape as the other tools, its own colour */
  .hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line3);box-shadow:0 6px 26px rgba(0,0,0,.5);overflow:hidden}
  .hdr::before{content:'';position:absolute;inset:-24px 0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(232,123,156,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(232,123,156,.07) 1px,transparent 1px);
    background-size:24px 24px;animation:tGrid 2.8s linear infinite}
  @keyframes tGrid{to{transform:translateY(24px)}}
  .hdr>*{position:relative;z-index:1}
  .hdr .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--accentB),var(--accentD));
    display:grid;place-items:center;font-weight:800;color:#fff0f5;font-size:14px;flex-shrink:0;
    box-shadow:0 0 18px var(--glow);animation:tFloat 4.5s ease-in-out infinite}
  @keyframes tFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;color:#fff}
  .hdr h1::after{content:'\2588';color:var(--accentB);margin-left:6px;animation:tCaret 1s steps(1,end) infinite}
  @keyframes tCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:rgba(0,0,0,.32);border:1px solid var(--line3);
    color:#f0d8e2;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accentB);animation:tLed 1.6s ease-in-out infinite}
  @keyframes tLed{0%,100%{opacity:.35}50%{opacity:1}}
  .pill b{color:var(--accentB)}
  .theme{background:none;border:1px solid var(--line3);color:#fff;border-radius:9px;width:34px;height:34px;
    font-size:15px;cursor:pointer;flex-shrink:0;transition:border-color .2s ease,transform .2s ease}
  .theme:hover{border-color:var(--accentB);transform:scale(1.06)}

  .tabs{position:sticky;top:55px;z-index:25;display:flex;gap:4px;overflow-x:auto;padding:10px 14px;
    background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;border:1px solid var(--line);background:var(--card-2);color:var(--muted);border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:transform .15s ease,border-color .15s ease,color .15s ease}
  .tab:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px var(--glowSoft)}

  main{max-width:860px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 40px)}
  @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;
    animation:rise .4s ease both}
  .panel h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accentB)}
  .panel h2 .tag{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);font-weight:400}
  .note{color:var(--muted);font-size:13px;line-height:1.55}

  /* the reminder bar */
  .remind{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .remind .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .remind .next{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--accentB);margin-left:auto}
  .btn{border:1px solid var(--line3);background:none;color:var(--text);border-radius:9px;padding:7px 13px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:border-color .18s ease,transform .18s ease,background .18s ease}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.stop{background:var(--warn);color:#1c0a03;border-color:transparent;animation:almPulse 1.1s ease-in-out infinite}
  @keyframes almPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,118,74,.55)}70%{box-shadow:0 0 0 9px rgba(242,118,74,0)}}
  .btn:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
  .btn:disabled:hover{border-color:var(--line);transform:none}

  /* the month */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;
    animation:rise .4s ease both}
  .cal-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .cal-title{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;margin-right:auto}
  .cal-title span{font-family:'Space Mono',monospace;font-size:12px;font-weight:400;color:var(--muted);
    margin-left:8px;white-space:nowrap}
  .cal-nav{border:1px solid var(--line3);background:none;color:var(--text);border-radius:8px;width:32px;height:32px;
    cursor:pointer;font-size:14px;font-family:inherit;flex-shrink:0;
    transition:border-color .18s ease,transform .18s ease}
  .cal-nav:hover{border-color:var(--accent);transform:translateY(-1px)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding-bottom:5px}
  .cal-day{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--card-2);border-radius:9px;
    padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;font-family:'Space Mono',monospace;
    font-size:12px;color:var(--text);transition:border-color .16s ease,transform .16s ease,background .16s ease}
  .cal-day:hover{border-color:var(--accent);transform:translateY(-1px)}
  .cal-day.out{opacity:.3}
  .cal-day.today{border-color:var(--accentB)}
  .cal-day.today .num{color:var(--accentB);font-weight:700}
  .cal-day.sel{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .cal-day.sel .num,.cal-day.sel .cal-more{color:var(--accent-ink)}
  .cal-day .num{line-height:1}
  .cal-dots{display:flex;flex-wrap:wrap;align-content:flex-end;gap:3px;margin-top:auto}
  .cal-dot{width:6px;height:6px;border-radius:50%;background:var(--accentB);flex-shrink:0}
  .cal-dot.over{background:var(--warn)}
  .cal-dot.soon{background:#e8a13c}
  .cal-day.sel .cal-dot{background:var(--accent-ink)}
  .cal-more{font-size:9px;color:var(--muted);line-height:1}
  .cal-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
  .cal-key i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .day-head{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px 2px}

  /* a task */
  .task{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:12px;padding:14px 15px;margin-bottom:10px;
    animation:rise .35s ease both}
  .task.over{border-left-color:var(--warn)}
  .task.soon{border-left-color:#e8a13c}
  .task .body{flex:1;min-width:0}
  .task .t{font-size:15.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .task .n{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .task .when{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;margin-top:7px;color:var(--muted)}
  .task .when b{color:var(--warn);font-weight:400}
  .tick{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line3);background:none;
    cursor:pointer;display:grid;place-items:center;color:transparent;font-size:14px;margin-top:2px;
    transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease}
  .tick:hover{border-color:var(--ok);color:var(--ok);transform:scale(1.08)}
  @keyframes tickOff{to{opacity:0;transform:translateX(26px) scale(.96)}}
  .task.going{animation:tickOff .32s ease forwards;pointer-events:none}

  /* add form */
  .field{margin-bottom:13px}
  .field label{display:block;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;background:var(--card-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font-size:14.5px;font-family:inherit;outline:none;
    transition:border-color .18s ease}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:78px;resize:vertical}
  .go{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px 20px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:transform .18s ease,box-shadow .18s ease}
  .go:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--glowSoft)}
  .go:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

  .empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:14.5px;line-height:1.6}
  .empty .big{font-size:38px;margin-bottom:10px;opacity:.65}
  .err{border:1px solid var(--warn);border-radius:12px;padding:14px 16px;color:var(--text);
    background:rgba(242,118,74,.08);font-size:14px;line-height:1.6}

  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12.5px;line-height:1.7}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy-2);
    color:#fff;border:1px solid var(--line3);border-radius:10px;padding:11px 18px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo">W</div>
  <h1>What To Do</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<div class="tabs" id="tabs"></div>
<main><div id="view"></div><footer></footer></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   What To Do — a first pass. Tasks live in the shared database so
   the same list shows on every device, and ticking one off on the
   phone clears it from the laptop.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TODOS = [], ACTIVE = 'Calendar', BUSY = false, LOAD_ERR = null;

/* ---------- theme (shared key with the other tools) ---------- */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* ---------- time helpers ---------- */
const pending = () => TODOS.filter(t => !t.done);
function whenText(due){
  if (!due) return { text:'no deadline', state:'' };
  const d = new Date(due), now = Date.now(), diff = d - now;
  const mins = Math.round(Math.abs(diff) / 60000);
  const rel = mins < 60 ? mins + ' min'
            : mins < 1440 ? Math.round(mins / 60) + ' h'
            : Math.round(mins / 1440) + ' d';
  const stamp = d.toLocaleString([], { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  if (diff < 0) return { text: stamp + ' · ' + rel + ' overdue', state:'over' };
  if (diff < 3600e3) return { text: stamp + ' · in ' + rel, state:'soon' };
  return { text: stamp + ' · in ' + rel, state:'' };
}

/* ---------- the month ----------
   A job with a deadline belongs on a date, so the calendar is the first thing
   you see. Jobs without one cannot be drawn on a grid, so they are listed
   under it rather than quietly dropped — undated is not the same as done. */
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let CAL_M = null;      // the first of the month on screen
let CAL_SEL = null;    // the day picked out, as yyyy-mm-dd

const dayKey = d => { const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

function tasksByDay(){
  const m = new Map();
  for (const t of pending()){
    if (!t.due) continue;
    const k = dayKey(t.due);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  }
  for (const list of m.values()) list.sort((a, b) => new Date(a.due) - new Date(b.due));
  return m;
}
const undated = () => pending().filter(t => !t.due);
function dayState(t){
  const diff = new Date(t.due) - Date.now();
  return diff < 0 ? 'over' : diff < 3600e3 ? 'soon' : '';
}
function monthLabel(d){ return d.toLocaleDateString([], { month:'long', year:'numeric' }); }

/* ---------- tabs ---------- */
function buildTabs(){
  const all = ['Calendar', 'Dashboard', 'Add To Do'];
  $('tabs').innerHTML = all.map(n =>
    '<button class="tab' + (n === ACTIVE ? ' on' : '') + '" data-t="' + n + '">' + n + '</button>').join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { ACTIVE = b.dataset.t; buildTabs(); render(); });
}
function refreshPill(){
  const n = pending().length;
  $('pill').innerHTML = '<b>' + n + '</b> pending' + (REMIND ? ' · reminding' : '');
}

/* ============================================================
   Reminders — every 15 minutes while this page is open.

   Worth being straight about the limit: with no server pushing to
   your phone, a browser can only remind you while the tab is
   alive. Closing it stops the reminders. Making them arrive with
   the tab shut needs push, which needs a server — a later job.
   ============================================================ */
const EVERY = 15 * 60 * 1000;
const REMIND_KEY = 'whattodo_remind';
const SOUND_KEY = 'whattodo_sound';
let REMIND = false, SOUND = true, timer = null, nextAt = 0, tick = null;

function canNotify(){ return typeof Notification !== 'undefined'; }

/* ---------- the ring ----------
   Synthesised rather than a file: nothing to download, works offline, and no
   sound sitting in the repo. A browser will not let a page make noise until
   it has been interacted with, so the context is opened on the click that
   turns reminders on — which is also why that click plays a short preview.
   Audio is not throttled the way animation is, so this still sounds with the
   tab in the background. It cannot sound with the tab closed. */
let AC = null, MASTER = null;
/* Nine partials and a hammer strike all landing at once add up, and a single
   strike was already peaking at 0.96 of full scale. Everything goes through a
   limiter so it cannot clip and crackle however many strikes overlap. */
function master(ctx){
  if (!MASTER){
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-8, ctx.currentTime);
    comp.knee.setValueAtTime(6, ctx.currentTime);
    comp.ratio.setValueAtTime(12, ctx.currentTime);
    comp.attack.setValueAtTime(0.002, ctx.currentTime);
    comp.release.setValueAtTime(0.20, ctx.currentTime);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.85, ctx.currentTime);
    comp.connect(g); g.connect(ctx.destination);
    MASTER = comp;
  }
  return MASTER;
}
function audioCtx(){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ return null; }
  return AC;
}
/* A tower bell.

   What makes a bell sound like struck metal rather than an organ is that its
   partials are not whole multiples of the note. A founder tunes them to the
   old ratios — hum an octave below, then prime, tierce a minor third above
   (which is why a big bell always sounds sombre), quint, and nominal an octave
   up. The high inharmonic ones give the clang and die away quickly while the
   hum hangs on for seconds. Each is detuned a hair so they beat against each
   other, which is the shimmer you hear from a real one.

   Plus the hammer itself: a scrap of filtered noise, gone in a moment. Without
   it the bell sounds blown rather than struck. */
const BELL = [
  { r:0.50, g:1.00, d:5.0 },   // hum
  { r:1.00, g:0.90, d:4.2 },   // prime
  { r:1.20, g:0.55, d:2.6 },   // tierce — the minor third
  { r:1.50, g:0.40, d:2.0 },   // quint
  { r:2.00, g:0.62, d:1.7 },   // nominal
  { r:2.52, g:0.24, d:1.0 },
  { r:3.01, g:0.19, d:0.75 },
  { r:4.17, g:0.13, d:0.45 },
  { r:5.43, g:0.09, d:0.30 }
];
/* Everything that gets scheduled is kept, so a minute of chiming already on
   the audio clock can still be cut off when Stop is pressed. */
let scheduled = [];
function keep(node){ scheduled.push(node); return node; }
function killScheduled(){
  for (const n of scheduled){ try { n.stop(0); } catch(e){} }
  scheduled = [];
}

let noiseBuf = null;
function hammer(ctx, at, level, tone){
  if (!noiseBuf){
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.06), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  }
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = noiseBuf;
  bp.type = 'bandpass'; bp.frequency.setValueAtTime(tone || 2600, at); bp.Q.setValueAtTime(1.1, at);
  g.gain.setValueAtTime(level, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
  src.connect(bp); bp.connect(g); g.connect(master(ctx));
  src.start(at); src.stop(at + 0.09); keep(src);
}
/* base is the prime. `hold` scales every partial's decay, which is the whole
   difference between a quarter bell and the hour bell. */
function strikePartials(ctx, at, base, level, hold){
  for (const p of BELL){
    const o = ctx.createOscillator(), g = ctx.createGain();
    const d = p.d * (hold || 1);
    o.type = 'sine';
    o.frequency.setValueAtTime(base * p.r * (1 + (Math.random() - 0.5) * 0.005), at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level * p.g), at + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(g); g.connect(master(ctx));
    o.start(at); o.stop(at + d + 0.05); keep(o);
  }
}
/* ---------- Big Ben ----------
   Westminster Quarters. The tune lives on four quarter bells in E major, and
   the hour is struck on the great bell — the one actually named Big Ben,
   which sounds E an octave and a half below.

   The phrases are the real ones. At the hour the tower plays four of them,
   sixteen strokes, and only then strikes the hour. A quarter past gets one
   phrase — which happens to be exactly what this tool wants for a fifteen
   minute nudge, so the quarter chime is the nudge and the full hour sequence
   is the alarm. */
const WQ = { B: 246.94, E: 329.63, Fs: 369.99, Gs: 415.30 };   // B3 E4 F#4 G#4
const WQ_QUARTER = ['Gs','Fs','E','B'];
const WQ_HOUR = [
  ['E','Gs','Fs','B'],
  ['E','Fs','Gs','E'],
  ['Gs','E','Fs','B'],
  ['B','Fs','Gs','E']
];
const GREAT_HZ = 82.41;          // E2 — the hour bell
const NOTE_GAP = 1.15, PHRASE_GAP = 2.05, HOUR_GAP = 4.6;

/* The quarter bells are smaller: brighter, and they let go sooner. */
function quarterBell(ctx, at, hz, level){
  hammer(ctx, at, level * 0.35, 3200);
  strikePartials(ctx, at, hz, level, 0.55);
}
/* The great bell is the opposite: slow to speak and slow to die. */
function greatBell(ctx, at, level){
  hammer(ctx, at, level * 0.45, 1800);
  strikePartials(ctx, at, GREAT_HZ, level, 1.8);
}

const ALARM_FOR = 60 * 1000;
let alarmEnds = 0, alarmTick = null, alarmStop = null;
const alarming = () => !!alarmStop;

function startAlarm(ms){
  stopAlarm(true);
  const ctx = audioCtx(); if (!ctx) return;
  const span = (ms || ALARM_FOR) / 1000;
  alarmEnds = Date.now() + span * 1000;

  /* Scheduled on the audio clock rather than by timer, because a melody drifts
     audibly if each note waits on setInterval. Every node is kept so the whole
     lot can be cut off — otherwise Stop would leave a minute of Westminster
     already committed and no way to call it back. */
  const t0 = ctx.currentTime + 0.06, endAt = t0 + span;
  let t = t0;
  for (const phrase of WQ_HOUR){
    for (const n of phrase){
      if (t < endAt) quarterBell(ctx, t, WQ[n], 0.20);
      t += NOTE_GAP;
    }
    t += PHRASE_GAP - NOTE_GAP;
  }
  t += 0.7;                                   // the pause before the hour strikes
  while (t < endAt){ greatBell(ctx, t, 0.34); t += HOUR_GAP; }

  alarmStop = () => killScheduled();
  if (navigator.vibrate) navigator.vibrate([260, 140, 200]);
  alarmTick = setInterval(() => {
    if (Date.now() >= alarmEnds){ stopAlarm(); return; }
    const el = $('almLeft'); if (el) el.textContent = alarmLeft();
  }, 500);
  render();
}
function stopAlarm(quiet){
  if (alarmStop) alarmStop();
  clearInterval(alarmTick);
  alarmTick = null; alarmStop = null; alarmEnds = 0;
  if (navigator.vibrate) navigator.vibrate(0);
  if (!quiet) render();
}
function alarmLeft(){
  return Math.max(0, Math.ceil((alarmEnds - Date.now()) / 1000)) + 's';
}
/* The quarter chime — one phrase, which is literally what a clock tower plays
   at a quarter past, and this nudges every fifteen minutes. */
function chime(){
  const ctx = audioCtx(); if (!ctx) return;
  let t = ctx.currentTime + 0.05;
  for (const n of WQ_QUARTER){ quarterBell(ctx, t, WQ[n], 0.17); t += NOTE_GAP; }
  if (navigator.vibrate) navigator.vibrate(180);
}
function ring(urgent){ if (urgent) startAlarm(); else chime(); }
function setSound(on){
  SOUND = on;
  try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch(e){}
  if (on) ring(false);                    // preview, and unlock audio on this click
  render();
}
function fire(){
  const list = pending();
  nextAt = Date.now() + EVERY;
  if (!list.length) return;                       // nothing to nag about
  const overdue = list.filter(t => t.due && new Date(t.due) < new Date()).length;
  const head = list.length + (list.length === 1 ? ' job pending' : ' jobs pending')
             + (overdue ? ' · ' + overdue + ' overdue' : '');
  const body = list.slice(0, 4).map(t => '• ' + t.title).join('\n')
             + (list.length > 4 ? '\n…and ' + (list.length - 4) + ' more' : '');
  if (canNotify() && Notification.permission === 'granted'){
    try { new Notification(head, { body: body, tag: 'whattodo', renotify: true }); } catch(e){}
  }
  if (SOUND) ring(overdue > 0);                   // chime, or the alarm if overdue
  toast(head, 5000);                              // always visible in-page too
  document.title = '(' + list.length + ') What To Do';
}
async function setRemind(on){
  REMIND = on;
  try { localStorage.setItem(REMIND_KEY, on ? '1' : '0'); } catch(e){}
  clearInterval(timer); clearInterval(tick); timer = tick = null;
  if (on){
    if (canNotify() && Notification.permission === 'default'){
      try { await Notification.requestPermission(); } catch(e){}
    }
    audioCtx();                                   // unlock sound on this click
    nextAt = Date.now() + EVERY;
    timer = setInterval(fire, EVERY);
    tick = setInterval(() => { const el = $('nextIn'); if (el) el.textContent = countdown(); }, 1000);
  } else {
    document.title = 'What To Do';
  }
  refreshPill(); render();
}
function countdown(){
  if (!REMIND) return 'off';
  const left = Math.max(0, nextAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  return 'next in ' + m + ':' + String(s).padStart(2, '0');
}

/* ---------- data ---------- */
async function refresh(){
  const r = await window.DB.listTodos();
  TODOS = r.items; LOAD_ERR = r.error;
  refreshPill(); render();
}
async function markDone(id, el){
  if (BUSY) return; BUSY = true;
  el.closest('.task').classList.add('going');     // let it slide out before the list redraws
  try {
    await window.AuthGate.require();
    await window.DB.setTodoDone(id, true);
    TODOS = TODOS.filter(t => t.id !== id);       // done means gone from here
    if (!pending().some(t => t.due && new Date(t.due) < new Date())) stopAlarm(true);
    setTimeout(() => { refreshPill(); render(); }, 300);
    toast('Done');
  } catch (err){
    el.closest('.task').classList.remove('going');
    toast(err.message, 6000);
  } finally { BUSY = false; }
}

/* ---------- views ---------- */
function taskHTML(t){
  const w = whenText(t.due);
  return '<div class="task ' + w.state + '">' +
    '<button class="tick" data-id="' + esc(t.id) + '" title="Mark done">✓</button>' +
    '<div class="body"><div class="t">' + esc(t.title) + '</div>' +
    (t.note ? '<div class="n">' + esc(t.note) + '</div>' : '') +
    '<div class="when">' + (w.state === 'over' ? '<b>' + esc(w.text) + '</b>' : esc(w.text)) + '</div>' +
    '</div></div>';
}
/* The control strip. Stop sits here whether or not anything is ringing — a
   button you have to go looking for once the bell has started is no use, and
   the old Test button in this spot only ever made more noise. */
function remindBar(){
  return '<div class="remind">' +
    '<span class="lab">Remind me every 15 min</span>' +
    '<button class="btn' + (REMIND ? ' on' : '') + '" id="remBtn">' + (REMIND ? 'On' : 'Off') + '</button>' +
    '<button class="btn' + (SOUND ? ' on' : '') + '" id="sndBtn">' + (SOUND ? '🔔 Ring' : '🔕 Silent') + '</button>' +
    (alarming()
      ? '<button class="btn stop" id="stopBtn">⏹ Stop alarm · <span id="almLeft">' + alarmLeft() + '</span></button>'
      : '<button class="btn" id="stopBtn" disabled title="Nothing is ringing">⏹ Stop alarm</button>') +
    (canNotify() && Notification.permission === 'denied'
      ? '<span class="note">notifications blocked — reminders show on the page</span>' : '') +
    '<span class="next" id="nextIn">' + countdown() + '</span></div>';
}
function renderCalendar(){
  const now = new Date(), today = dayKey(now);
  const base = CAL_M ? new Date(CAL_M) : new Date(now.getFullYear(), now.getMonth(), 1);
  const byDay = tasksByDay(), loose = undated();

  // the grid starts on the Monday of the week the 1st falls in
  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const lead = (first.getDay() + 6) % 7;
  const start = new Date(first); start.setDate(1 - lead);

  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = dayKey(d), list = byDay.get(k) || [];
    const cls = ['cal-day'];
    if (d.getMonth() !== base.getMonth()) cls.push('out');
    if (k === today) cls.push('today');
    if (k === CAL_SEL) cls.push('sel');
    const shown = list.slice(0, 4).map(t => '<span class="cal-dot ' + dayState(t) + '"></span>').join('');
    cells += '<div class="' + cls.join(' ') + '" data-d="' + k + '" title="' +
      esc(list.length ? list.length + (list.length === 1 ? ' job' : ' jobs') : 'nothing due') + '">' +
      '<span class="num">' + d.getDate() + '</span>' +
      '<span class="cal-dots">' + shown +
        (list.length > 4 ? '<span class="cal-more">+' + (list.length - 4) + '</span>' : '') +
      '</span></div>';
  }

  let h = remindBar();
  if (LOAD_ERR) h += '<div class="err"><b>The list could not be read.</b><br>' + esc(LOAD_ERR) + '</div>';
  h += '<div class="cal"><div class="cal-head">' +
    '<div class="cal-title">' + esc(monthLabel(base)) +
      '<span>' + pending().length + ' pending</span></div>' +
    '<button class="cal-nav" id="calPrev" title="Previous month">‹</button>' +
    '<button class="btn" id="calToday">Today</button>' +
    '<button class="cal-nav" id="calNext" title="Next month">›</button></div>' +
    '<div class="cal-grid">' + DOW.map(d => '<div class="cal-dow">' + d + '</div>').join('') + cells + '</div>' +
    '<div class="cal-key">' +
      '<span><i style="background:var(--warn)"></i>overdue</span>' +
      '<span><i style="background:#e8a13c"></i>within the hour</span>' +
      '<span><i style="background:var(--accentB)"></i>later</span></div></div>';

  // whichever day is picked out, then anything with no date at all
  if (CAL_SEL){
    const list = byDay.get(CAL_SEL) || [];
    const d = new Date(CAL_SEL + 'T00:00:00');
    h += '<div class="day-head">' + esc(d.toLocaleDateString([], { weekday:'long', day:'numeric', month:'long' })) +
         ' · ' + (list.length ? list.length + (list.length === 1 ? ' job' : ' jobs') : 'nothing due') + '</div>';
    h += list.length ? list.map(taskHTML).join('')
       : '<div class="empty" style="padding:26px 20px">Nothing due this day.</div>';
  }
  if (loose.length){
    h += '<div class="day-head">' + loose.length +
         (loose.length === 1 ? ' job with no date' : ' jobs with no date') + '</div>';
    h += loose.map(taskHTML).join('');
  }
  if (!pending().length){
    h += '<div class="empty"><div class="big">✓</div>Nothing pending.<br>' +
         'Add something on the <b>Add To Do</b> tab.</div>';
  }
  return h;
}
function renderDashboard(){
  const list = pending();
  let h = remindBar();

  if (LOAD_ERR){
    h += '<div class="err"><b>The list could not be read.</b><br>' + esc(LOAD_ERR) + '</div>';
    if (!list.length) return h;
  }
  if (!list.length){
    h += '<div class="empty"><div class="big">✓</div>Nothing pending.<br>' +
         'Add something on the <b>Add To Do</b> tab.</div>';
    return h;
  }
  h += list.map(taskHTML).join('');
  return h;
}
function renderAdd(){
  return '<div class="panel"><h2><span class="dot"></span>Add a job</h2>' +
    '<p class="note" style="margin-bottom:15px">It lands on the calendar under its due date, on every device.</p>' +
    '<div class="field"><label for="tTitle">What needs doing</label>' +
      '<input id="tTitle" maxlength="200" placeholder="e.g. Send the MW update to Manoj"></div>' +
    '<div class="field"><label for="tNote">Notes (optional)</label>' +
      '<textarea id="tNote" maxlength="2000" placeholder="Anything worth remembering"></textarea></div>' +
    '<div class="field"><label for="tDue">Due (optional)</label>' +
      '<input id="tDue" type="datetime-local"></div>' +
    '<button class="go" id="addBtn">Add to the list</button></div>';
}
function render(){
  $('view').innerHTML = ACTIVE === 'Calendar' ? renderCalendar()
                      : ACTIVE === 'Dashboard' ? renderDashboard() : renderAdd();
  if (ACTIVE === 'Calendar' || ACTIVE === 'Dashboard'){
    const rb = $('remBtn'); if (rb) rb.onclick = () => setRemind(!REMIND);
    const sb = $('sndBtn'); if (sb) sb.onclick = () => setSound(!SOUND);   // on plays a preview
    const stb = $('stopBtn'); if (stb && !stb.disabled) stb.onclick = () => { stopAlarm(); toast('Alarm stopped'); };
    [...document.querySelectorAll('.tick')].forEach(b => b.onclick = () => markDone(b.dataset.id, b));
  }
  if (ACTIVE === 'Calendar'){
    const now = new Date();
    const base = CAL_M ? new Date(CAL_M) : new Date(now.getFullYear(), now.getMonth(), 1);
    const step = n => () => { CAL_M = new Date(base.getFullYear(), base.getMonth() + n, 1); render(); };
    const p = $('calPrev'); if (p) p.onclick = step(-1);
    const nx = $('calNext'); if (nx) nx.onclick = step(1);
    const td = $('calToday'); if (td) td.onclick = () => {
      CAL_M = new Date(now.getFullYear(), now.getMonth(), 1); CAL_SEL = dayKey(now); render();
    };
    [...document.querySelectorAll('.cal-day')].forEach(c => c.onclick = () => {
      CAL_SEL = (CAL_SEL === c.dataset.d) ? null : c.dataset.d;   // clicking the same day again clears it
      render();
    });
  }
  if (ACTIVE === 'Add To Do'){
    const add = $('addBtn');
    add.onclick = async () => {
      const title = $('tTitle').value.trim();
      if (!title){ toast('Give it a title first'); $('tTitle').focus(); return; }
      add.disabled = true; add.textContent = 'Adding…';
      try {
        await window.AuthGate.require();
        const due = $('tDue').value ? new Date($('tDue').value).toISOString() : null;
        await window.DB.addTodo({ title, note: $(tNote).value.trim(), due });
        await refresh();
        // land on the day it is due, so you see where it went
        if (due){ const d = new Date(due); CAL_M = new Date(d.getFullYear(), d.getMonth(), 1); CAL_SEL = dayKey(d); }
        ACTIVE = Calendar; buildTabs(); render();
        toast('Added');
      } catch (err){
        toast(err.message, 6000);
        add.disabled = false; add.textContent = 'Add to the list';
      }
    };
    $('tTitle').focus();
  }
  renderFooter();
}
function renderFooter(){
  const lead = window.DB.configured() ? 'Shared across every device' : 'Not syncing yet — anon key missing';
  let h = lead + ' · reminders run while this page is open';
  h += '<br><a href="#" id="acct">…</a>';
  document.querySelector('footer').innerHTML = h;
  const ac = $('acct');
  const paint = s => { ac.textContent = s ? ('signed in as ' + s.user.email + ' · sign out') : 'sign in to add or tick off'; };
  window.DB.session().then(paint);
  ac.onclick = async e => {
    e.preventDefault();
    const s = await window.DB.session();
    if (s){ await window.DB.signOut(); toast('Signed out'); paint(null); }
    else { const ns = await window.AuthGate.signIn(); if (ns){ toast('Signed in'); paint(ns); } }
  };
}

/* ---------- boot ---------- */
(async function(){
  buildTabs();
  try { REMIND = localStorage.getItem(REMIND_KEY) === '1';
        SOUND  = localStorage.getItem(SOUND_KEY)  !== '0'; } catch(e){}
  await refresh();
  if (REMIND) setRemind(true); else render();
  window.DB.onAuth(() => renderFooter());
  // someone ticked one off elsewhere — drop it here too
  window.DB.subscribeTodos(refresh);
})();
</script>
</body>
</html>
