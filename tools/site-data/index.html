<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Site Data Lookup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="../_lib/lookup.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">
<style>
  /* Site Data – violet. Technical site records. */
  :root,html[data-theme="dark"]{--accent:#7a68e8;--accentB:#9a8bf2;--accentD:#5847c0;--accent-ink:#0a0620;
    --glow:rgba(122,104,232,.5);--glowSoft:rgba(122,104,232,.28)}
  html[data-theme="light"]{--accent:#5a49c6;--accentB:#7a68e8;--accentD:#45359e;--accent-ink:#ffffff;
    --glow:rgba(90,73,198,.4);--glowSoft:rgba(90,73,198,.22)}

  /* the site's mark, and the way back to it */
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;text-decoration:none;font-size:0;
    padding:0;border:none;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease}
  .hdr .logo:hover{transform:scale(1.09);box-shadow:0 0 24px rgba(176,58,86,.75)}
  .hdr .logo:focus-visible{outline:2px solid #f7edf0;outline-offset:3px}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  @media (prefers-reduced-motion:reduce){.hdr .logo{transition:none}}

  /* the site's name beside its mark, both leading home */
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-0.02em;color:#fff;white-space:nowrap}
  /* the site's name and the tool's are different things, so they are kept apart */
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  /* the mark is inside the link now, so the lift belongs to the whole brand */
  .hdr .brand:hover .logo{transform:scale(1.06)}
  /* on a narrow screen the tool's own name is the one worth keeping */

  /* What a cramped header gives up, and in what order. The status pill is the
     most expendable thing in it — it was taking half the bar and squeezing the
     tool name down to "Site Ac…" long before the site name joined it. */
  .hdr h1{flex:0 1 auto;min-width:7ch}
  .hdr .pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }
</style>
<script src="../_lib/theme.js" defer></script>
<script src="../_lib/owner-config.js"></script>
<script src="../_lib/owner.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Site Data Lookup</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<main>
  <div class="searchwrap">
    <span class="ic">⌕</span>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
      placeholder="Search site ID, name, district, vendor…" aria-label="Search sites">
    <button class="clr" id="clr" aria-label="Clear">×</button>
  </div>
  <div class="hint" id="hint"></div>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls">
<script>
window.LOOKUP_CONFIG = {
  dataUrl:'data.json', idbName:'site_data_db', idbStore:'ds', sheetName:'Site Data',
  unit:'sites', unitSingular:'site', source:'DNS Operational Site list · Site Data sheet',
  homeIcon:'🗼', homeText:n=>'Search '+n.toLocaleString()+' sites for full technical data – TX, tower, power, equipment.<br>All data stays on your device.',
  idCol:'Site_Id', nameCol:'Site_Name', metaCol:'District',
  latCol:'Lat', lngCol:'Lng', telCol:'Site_Owner_Contact',
  searchCols:['Site_Id','Site_Name','District','Province','Region','Depot','Address','Vendor','TX_Technology','Owner'],
  labels:{
    Site_Id:'Site ID', Site_Name:'Site name', Status:'Status',
    TX_Type:'TX type', TX_Technology:'TX technology', Address:'Address',
    District:'District', Province:'Province', Region:'Region', Depot:'Depot',
    DS_Division:'DS division', GS_Division:'GS division', Local_Authority:'Local authority', Police_Station:'Police station',
    Lat:'Latitude', Lng:'Longitude', Elevation:'Elevation (m)',
    Owner:'Owner', Site_Owner_Name:'Owner name', Site_Owner_Contact:'Owner contact',
    Access_24_7:'24/7 access', Night_Time_Access:'Night-time access', Weekday_Holiday_Access:'Weekday / holiday access',
    Tower_Type:'Tower type', Tower_Height:'Tower height (m)', Building_Height:'Building height (m)', Cabinet_Type:'Cabinet type',
    Vendor:'Vendor', Final_Rank:'Final rank', Self_Tx_Traffic:'Self TX traffic', Agg_Tx_Traffic:'Aggregate TX traffic',
    Gen_Availability:'Generator', PG_Allowed:'PG allowed', Site_DC_Load:'DC load', Solar_Availability:'Solar',
    Tx_Antenna_Count:'TX antennas', RRU_Count:'RRUs', AP_Antenna_Count:'AP antennas',
    CSR_Count:'CSRs', AIU_Count:'AIUs', WiBAS_Ant_Count:'WiBAS antennas'
  },
  groups:[
    {h:'Identity', f:['Site_Id','Site_Name','Status']},
    {h:'Transmission', f:['TX_Type','TX_Technology','Vendor','Final_Rank','Self_Tx_Traffic','Agg_Tx_Traffic']},
    {h:'Location', f:['Address','District','Province','Region','Depot','DS_Division','GS_Division','Local_Authority','Police_Station','Lat','Lng','Elevation']},
    {h:'Owner & access', f:['Owner','Site_Owner_Name','Site_Owner_Contact','Access_24_7','Night_Time_Access','Weekday_Holiday_Access']},
    {h:'Tower & cabinet', f:['Tower_Type','Tower_Height','Building_Height','Cabinet_Type']},
    {h:'Power', f:['Gen_Availability','PG_Allowed','Site_DC_Load','Solar_Availability']},
    {h:'Equipment count', f:['Tx_Antenna_Count','RRU_Count','AP_Antenna_Count','CSR_Count','AIU_Count','WiBAS_Ant_Count']}
  ],
  full:['Site_Name','Address'],
  mono:['Site_Id','Lat','Lng','Site_Owner_Contact','Elevation','Tower_Height','Building_Height'],
  badges:(r,v)=>{
    const out=[]; const st=v(r,'Status'); const acc=v(r,'Access_24_7');
    if(st&&st!=='Unknown') out.push({text:st,kind:/live/i.test(st)?'ok':'info'});
    if(/^y(es)?$/i.test(acc)) out.push({text:'✓ 24/7 access',kind:'ok'});
    else if(/^n(o)?$/i.test(acc)) out.push({text:'⏱ Access restricted',kind:'warn'});
    return out;
  },
  subBits:(r,v)=>[ v(r,'TX_Technology'), v(r,'Region'), v(r,'District') ]
};
</script>
<script src="../_lib/lookup.js"></script>
</body>
</html>
