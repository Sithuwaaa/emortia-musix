<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Site Access Lookup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="../_lib/lookup.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">
<style>
  /* Site Access - azure. Access & permissions. */
  :root,html[data-theme="dark"]{--accent:#2f8fd4;--accentB:#5fb0ea;--accentD:#1f6ba6;--accent-ink:#03151f;
    --glow:rgba(47,143,212,.5);--glowSoft:rgba(47,143,212,.28)}
  html[data-theme="light"]{--accent:#1d6fae;--accentB:#2f8fd4;--accentD:#155585;--accent-ink:#ffffff;
    --glow:rgba(29,111,174,.4);--glowSoft:rgba(29,111,174,.22)}

  /* the site's mark, and the way back to it */
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;text-decoration:none;font-size:0;
    padding:0;border:none;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease}
  .hdr .logo:hover{transform:scale(1.09);box-shadow:0 0 24px rgba(176,58,86,.75)}
  .hdr .logo:focus-visible{outline:2px solid #f7edf0;outline-offset:3px}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  @media (prefers-reduced-motion:reduce){.hdr .logo{transition:none}}

  /* the site's name beside its mark, both leading home */
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-0.02em;color:#fff;white-space:nowrap}
  /* the site's name and the tool's are different things, so they are kept apart */
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  /* the mark is inside the link now, so the lift belongs to the whole brand */
  .hdr .brand:hover .logo{transform:scale(1.06)}
  /* on a narrow screen the tool's own name is the one worth keeping */

  /* What a cramped header gives up, and in what order. The status pill is the
     most expendable thing in it - it was taking half the bar and squeezing the
     tool name down to "Site Ac…" long before the site name joined it. */
  .hdr h1{flex:0 1 auto;min-width:7ch}
  .hdr .pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }
</style>
<script src="../_lib/theme.js" defer></script>
<script src="../_lib/owner-config.js"></script>
<script src="../_lib/owner.js"></script>
<script src="../_lib/supabase-config.js"></script>
<script src="../_lib/db.js"></script>
<script src="../_lib/access-config.js"></script>
<script src="../_lib/access.js"></script>
<script>Access.protect();</script>
<script src="../_lib/authgate.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Site Access Lookup</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<main>
  <div class="searchwrap">
    <span class="ic">⌕</span>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
      placeholder="Search site ID, name, district…" aria-label="Search sites">
    <button class="clr" id="clr" aria-label="Clear">×</button>
  </div>
  <div class="hint" id="hint"></div>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls">
<script>
window.LOOKUP_CONFIG = {
  dataUrl:'data.json', idbName:'site_access_db', idbStore:'ds', sheetName:'Sheet1',
  syncKey:'site_access',          // shared through Supabase; see tools/_lib/db.js
  unit:'sites', unitSingular:'site', source:'DNS Operational Site list · Sheet1',
  homeIcon:'📡', homeText:n=>'Search '+n.toLocaleString()+' Dialog sites by ID, name, district or address.<br>The same data on every device.',
  idCol:'Site_ID', nameCol:'Site_Name', metaCol:'District',
  latCol:'Latitude', lngCol:'Longitude', telCol:'Depot_Contact',
  searchCols:['Site_ID','Other_Site_IDS','Site_Name','District','New_Region','Depot','Additional_data-Site_Address'],
  labels:{
    Site_ID:'Site ID', Other_Site_IDS:'Other IDs', Site_Name:'Site name',
    New_Region:'Region', District:'District', Depot:'Depot',
    'Depot_officer(FME_ID)':'Depot officer', Depot_Contact:'Depot contact',
    Latitude:'Latitude', Longitude:'Longitude',
    Tower_Category:'Tower category', Tower_Type:'Tower type',
    Access_Permission_providing_Party:'Permission from', Tower_Owner:'Tower owner',
    Permission_arrangement_final:'Permission arrangement', Time_restricted_reason:'Restriction reason',
    Week_Days_Access_Restricted_time:'Weekday restricted', 'Week_ends/Holydays_Access_Restricted_time':'Weekend / holiday restricted',
    Time_Restrictions_final:'Time restrictions', 'Additional_data-Site_Address':'Site address'
  },
  groups:[
    {h:'Identity', f:['Site_ID','Other_Site_IDS','Site_Name']},
    {h:'Location', f:['New_Region','District','Latitude','Longitude','Additional_data-Site_Address']},
    {h:'Depot & contact', f:['Depot','Depot_officer(FME_ID)','Depot_Contact']},
    {h:'Tower', f:['Tower_Category','Tower_Type','Tower_Owner']},
    {h:'Access & permission', f:['Access_Permission_providing_Party','Permission_arrangement_final','Time_restricted_reason','Time_Restrictions_final','Week_Days_Access_Restricted_time','Week_ends/Holydays_Access_Restricted_time']}
  ],
  full:['Site_Name','Additional_data-Site_Address','Permission_arrangement_final','Time_restricted_reason','Time_Restrictions_final'],
  mono:['Site_ID','Other_Site_IDS','Latitude','Longitude','Depot_Contact','Depot_officer(FME_ID)'],
  badges:(r,v)=>{
    const t=v(r,'Time_Restrictions_final');
    if(!t) return [];
    return /no\s*(time\s*)?restrict/i.test(t) ? [{text:'✓ '+t,kind:'ok'}] : [{text:'⏱ '+t,kind:'warn'}];
  },
  subBits:(r,v)=>{ const o=v(r,'Other_Site_IDS'), id=v(r,'Site_ID'); return [ (o&&o!==id)?'also '+o:'', v(r,'New_Region'), v(r,'District') ]; },
  merge:{
    officerFrom:'Depot', officerCol:'Depot_officer(FME_ID)', contactCol:'Depot_Contact',
    aliases:{
      'Site_ID':['site id','site_id','siteid'],
      'Site_Name':['site name','site_name','sitename','name'],
      'Latitude':['lat','latitude'],
      'Longitude':['long','lng','longitude'],
      'Depot':['depot'],
      'District':['district'],
      'New_Region':['region','new region','new_region'],
      'Other_Site_IDS':['other ids','other site ids','other_site_ids'],
      'Additional_data-Site_Address':['address','site address','site_address']
    }
  },
  copyText:(r,v)=>{
    const bad=s=>!s||/^(unknown|undefined|0|deny)$/i.test(String(s).trim());
    const lat=v(r,'Latitude'), lng=v(r,'Longitude');
    const officer=String(v(r,'Depot_officer(FME_ID)')||'').replace(/_\d+$/,'').trim();
    const out=[];
    if(!bad(lat)&&!bad(lng)) out.push('https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng));
    out.push('Site ID - '+(v(r,'Site_ID')||''));
    out.push('Site Name - '+(v(r,'Site_Name')||''));
    out.push('Depot Officer - '+officer);
    out.push('Depot Officer Contact No - '+(v(r,'Depot_Contact')||''));
    return out.join('\n');
  }
};
</script>
<script src="../_lib/lookup.js"></script>
</body>
</html>
